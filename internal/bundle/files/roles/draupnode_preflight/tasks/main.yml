---
- name: Comprobar el sistema operativo
  ansible.builtin.assert:
    that: preflight_os | length == 0 or (ansible_distribution | lower) in preflight_os
    fail_msg: "Este proyecto necesita {{ preflight_os | join(' o ') }}, y el servidor tiene {{ ansible_distribution }} {{ ansible_distribution_version }}."
    quiet: true

- name: Comprobar la memoria RAM (mínimo {{ preflight_ram_mb }} MB)
  ansible.builtin.assert:
    that: ansible_memtotal_mb >= preflight_ram_mb
    fail_msg: "Hacen falta {{ preflight_ram_mb }} MB de RAM y el servidor tiene {{ ansible_memtotal_mb }} MB."
    quiet: true
  when: preflight_ram_mb | int > 0

# df en vez de ansible_mounts: en contenedores y algunos servidores «/» no
# aparece en esa lista.
- name: Medir el espacio libre en /
  ansible.builtin.command: df -Pk /
  register: preflight_df
  changed_when: false
  check_mode: false
  when: preflight_disk_gb | int > 0

- name: Comprobar el espacio libre en disco (mínimo {{ preflight_disk_gb }} GB)
  vars:
    libre_gb: "{{ ((preflight_df.stdout_lines[-1].split()[3] | int) / 1048576) | round(1) }}"
  ansible.builtin.assert:
    that: libre_gb | float >= preflight_disk_gb | float
    fail_msg: "Hacen falta {{ preflight_disk_gb }} GB libres en / y hay {{ libre_gb }} GB."
    quiet: true
  when: preflight_disk_gb | int > 0

- name: Carpeta de secretos del proyecto
  ansible.builtin.file:
    path: "{{ draupnode_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Comprobaciones «container_free» de los módulos: un contenedor con ese nombre
# que no sea de este proyecto (etiqueta draupnode.proyecto) chocaría con él.
- name: Buscar contenedores con el mismo nombre
  ansible.builtin.shell: command -v docker >/dev/null && docker inspect {{ item.name | quote }} 2>/dev/null || true
  register: preflight_ctr
  changed_when: false
  check_mode: false
  loop: "{{ preflight_containers | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Contenedores de otra instalación
  ansible.builtin.set_fact:
    preflight_ajenos: >-
      {{ preflight_ctr.results
         | selectattr('stdout', 'match', '^\s*\[\s*\{')
         | rejectattr('stdout', 'search', '"draupnode.proyecto":\s*"' ~ draupnode_project ~ '"')
         | map(attribute='item') | list }}
  when: preflight_containers | default([]) | length > 0

# Un solo aviso (en un bucle, Ansible solo enseñaría «All items completed»).
- name: Aviso de contenedores que ya existen
  ansible.builtin.debug:
    msg: >-
      {% for c in preflight_ajenos %}Ya hay un contenedor «{{ c.name }}» que no es de este proyecto
      ({{ c.module }} quiere usar ese nombre). {% endfor %}Al aplicar se detendrá aquí: cambia el nombre
      en el módulo o quita el contenedor antiguo.
  when: ansible_check_mode and preflight_ajenos | default([]) | length > 0

- name: No pisar contenedores de otra instalación
  ansible.builtin.fail:
    msg: >-
      Ya hay un contenedor «{{ preflight_ajenos[0].name }}» que no es de este proyecto
      ({{ preflight_ajenos[0].module }} quiere usar ese nombre). Cambia el nombre en el módulo
      o quita el contenedor antiguo; no se ha tocado nada.
  when:
    - not ansible_check_mode
    - preflight_ajenos | default([]) | length > 0
