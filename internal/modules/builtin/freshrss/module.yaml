id: freshrss
name: "FreshRSS (lector de noticias RSS)"
version: 1.0.0
category: 7 · Apps
description: "Sigue webs, blogs y canales por RSS en un solo sitio, sin algoritmos. Compatible con apps de móvil (Fever y Google Reader)."
details: |
  FreshRSS en Docker, con base SQLite. Draupnode lo instala con el
  usuario «admin» y su contraseña generada en el servidor (en
  «Contraseñas»; vale también para las apps de móvil, en
  «Configuración → Perfil → contraseña de la API»). Comprueba las
  novedades cada 20 minutos.
  Sus datos están en /srv/draupnode/apps/freshrss (entran en las copias del
  módulo Copias). Licencia: AGPL-3.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
firewall_ports_from: [freshrss_public_port]
proxy_site:
  domain: freshrss_domain
  port: freshrss_port
secrets:
  - file: freshrss_admin
    label: Usuario «admin» de FreshRSS
uninstall_warning: "Para y quita los contenedores de FreshRSS."
uninstall_data: "Borrar también sus datos (las suscripciones, los artículos guardados y los usuarios). No se puede deshacer."
variables:
  - name: freshrss_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 8070
    min: 1024
    max: 65535
  - name: freshrss_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: freshrss_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: freshrss_update
    label: Actualizar FreshRSS al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://freshrss.org
  - label: "Código fuente"
    url: https://github.com/FreshRSS/FreshRSS

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «FreshRSS» y aplica."
    - "Pulsa «Abrir (túnel SSH)», entra con «admin» y añade una fuente RSS."
  comprobar:
    - "Entras con «admin» y la contraseña de «Contraseñas»."
    - "Los artículos de la fuente aparecen (se actualizan solos cada 20 minutos)."
  necesita:
    - "Nada."
  problemas:
    - "Las apps de móvil no conectan → activa la API en la configuración del usuario; la contraseña de la API es la misma de «Contraseñas»."
