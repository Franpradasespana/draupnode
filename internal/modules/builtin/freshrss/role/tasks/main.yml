---
- name: Carpeta de FreshRSS
  ansible.builtin.set_fact:
    freshrss_dir: /srv/draupnode/apps/freshrss
    freshrss_url: "{{ ('https://' ~ freshrss_domain) if freshrss_domain else ('http://127.0.0.1:' ~ freshrss_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # Los permisos de data, extensions los pone la imagen: no se tocan.
    mode: "{{ omit if (item | basename) in ['data', 'extensions'] else '0750' }}"
  loop:
    - "{{ freshrss_dir }}"
    - "{{ freshrss_dir }}/data"
    - "{{ freshrss_dir }}/extensions"

- name: Contraseña «.freshrss_admin_pass» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    freshrss_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.freshrss_admin_pass', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: Usuario y contraseña, para verlos en la app
  ansible.builtin.copy:
    dest: "{{ draupnode_secrets_dir }}/freshrss_admin"
    mode: "0600"
    content: "Usuario: admin\nContraseña: {{ freshrss_admin_pass }}\nLa misma contraseña sirve para la API (apps de móvil).\n"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ freshrss_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar FreshRSS
  ansible.builtin.command: docker compose -p dn-freshrss up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ freshrss_dir }}"
  register: freshrss_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: freshrss_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in freshrss_up.stderr or 'Created' in freshrss_up.stderr or 'Recreated' in freshrss_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ freshrss_port }}/i/"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: freshrss_http
  until: freshrss_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 30
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-freshrss
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      FreshRSS {{ 'responde' if (freshrss_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-freshrss logs, en ' ~ freshrss_dir ~ ')' }} en {{ freshrss_url }}.
      Entra con «admin» (contraseña en «Contraseñas») y añade tus fuentes RSS.
