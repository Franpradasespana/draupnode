---
- name: Falta el certificado
  ansible.builtin.assert:
    that: backup_target_tls_cert | length > 0
    fail_msg: "Falta el certificado HTTPS: crea el destino desde la página del módulo «Copias» de otro proyecto («Guardar también en otro servidor…»)."
    quiet: true

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ backup_target_dir }}", mode: "0700" }
    - { path: "{{ backup_target_dir }}/datos", mode: "0700" }
    - { path: "{{ backup_target_dir }}/tls", mode: "0700" }

- name: Certificado HTTPS
  ansible.builtin.copy:
    dest: "{{ backup_target_dir }}/tls/cert.pem"
    content: "{{ backup_target_tls_cert | b64decode }}"
    mode: "0644"
  register: backup_target_cert

- name: Clave privada HTTPS
  ansible.builtin.copy:
    dest: "{{ backup_target_dir }}/tls/key.pem"
    content: "{{ backup_target_tls_key | b64decode }}"
    mode: "0644"
  register: backup_target_key
  no_log: true

# El contenedor no corre como root: la clave tiene que poder leerla, pero
# la carpeta tls es 0700 de root en el servidor, así que nadie más la ve.

- name: Usuarios (.htpasswd)
  ansible.builtin.copy:
    dest: "{{ backup_target_dir }}/datos/.htpasswd"
    content: "{{ (backup_target_clients | join('\n') ~ '\n') if backup_target_clients else '' }}"
    mode: "0644"
  no_log: true

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ backup_target_dir }}/docker-compose.yml"
    mode: "0600"
  register: backup_target_compose

- name: Arrancar rest-server
  ansible.builtin.command: docker compose up -d --quiet-pull {{ '--force-recreate' if (backup_target_cert is changed or backup_target_key is changed) else '' }}
  args:
    chdir: "{{ backup_target_dir }}"
  register: backup_target_up
  changed_when: "'Started' in backup_target_up.stderr or 'Created' in backup_target_up.stderr or 'Recreated' in backup_target_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ backup_target_port }}/"
    validate_certs: false
    status_code: [200, 401, 403, 404, 405]
  register: backup_target_http
  until: backup_target_http.status in [200, 401, 403, 404, 405]
  retries: 20
  delay: 2
  failed_when: false
  when: not ansible_check_mode

# ---------------------------------------------------------------- rotación
- name: Rotación (datos)
  ansible.builtin.set_fact:
    backup_target_keydir: "{{ draupnode_secrets_dir }}/.rotacion"
    backup_target_rotar: "/usr/local/sbin/draupnode-rotar-{{ draupnode_project }}"
    backup_target_unit: "draupnode-rotar-{{ draupnode_project }}"
    backup_target_clientes: "{{ backup_target_clients | map('regex_replace', ':.*$', '') | list }}"
    backup_target_con_clave: "{{ (backup_target_keys | default('')).splitlines() | select | map('regex_replace', ':.*$', '') | list }}"
  no_log: true

- name: Instalar restic (para rotar)
  ansible.builtin.apt:
    name: restic
    state: present
    lock_timeout: 600
  when: backup_target_prune | bool

- name: Carpeta de contraseñas de la rotación
  ansible.builtin.file:
    path: "{{ backup_target_keydir }}"
    state: "{{ 'directory' if backup_target_prune | bool else 'absent' }}"
    mode: "0700"
  when: not ansible_check_mode

- name: Contraseña de las copias de cada proyecto (solo root)
  ansible.builtin.copy:
    dest: "{{ backup_target_keydir }}/{{ item.split(':', 1)[0] }}"
    content: "{{ item.split(':', 1)[1] }}"
    mode: "0600"
  loop: "{{ (backup_target_keys | default('')).splitlines() | select | list }}"
  loop_control:
    label: "{{ item.split(':', 1)[0] }}"
  no_log: true
  when: backup_target_prune | bool and not ansible_check_mode

- name: Quitar contraseñas de proyectos que ya no guardan aquí
  ansible.builtin.shell: |
    cd {{ backup_target_keydir | quote }} 2>/dev/null || exit 0
    for f in *; do
      [ -e "$f" ] || continue
      case " {{ backup_target_clientes | join(' ') }} " in *" $f "*) ;; *) rm -f -- "$f"; echo quitada ;; esac
    done
  register: backup_target_keys_quitadas
  changed_when: "'quitada' in backup_target_keys_quitadas.stdout"
  when: backup_target_prune | bool and not ansible_check_mode

- name: Script de rotación
  ansible.builtin.copy:
    dest: "{{ backup_target_rotar }}"
    mode: "0700"
    content: |
      #!/usr/bin/env bash
      # Generado por Draupnode (módulo backup-target, proyecto {{ draupnode_project }}). Se reescribe al aplicar.
      # Borra en cada proyecto las copias de más de {{ backup_target_keep_days }} días
      # (y guarda una al mes durante {{ backup_target_keep_monthly }} meses).
      set -uo pipefail
      export RESTIC_CACHE_DIR=/var/cache/restic
      fallos=0
      for clave in {{ backup_target_keydir | quote }}/*; do
        [ -f "$clave" ] || continue
        p=$(basename "$clave")
        repo={{ (backup_target_dir ~ '/datos') | quote }}/"$p"
        [ -f "$repo/config" ] || { echo "$p: aún no tiene copias"; continue; }
        echo "== $p"
        if restic -r "$repo" --password-file "$clave" --retry-lock 2h forget --prune --group-by "" --keep-within {{ backup_target_keep_days }}d{{ (' --keep-within-monthly ' ~ backup_target_keep_monthly ~ 'm') if backup_target_keep_monthly | int > 0 else '' }} 2>&1 | tail -n 4; then
          echo "$p: rotación hecha ($(restic -r "$repo" --password-file "$clave" snapshots --json 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '?') copias)"
        else
          echo "$p: FALLO en la rotación"; fallos=1
        fi
      done
      exit $fallos
  when: backup_target_prune | bool

- name: Servicio y temporizador de la rotación
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: "{{ backup_target_unit }}.service"
      content: |
        [Unit]
        Description=Rotación de copias del destino de Draupnode ({{ draupnode_project }})
        [Service]
        Type=oneshot
        ExecStart={{ backup_target_rotar }}
    - name: "{{ backup_target_unit }}.timer"
      content: |
        [Unit]
        Description=Rotación diaria de copias ({{ draupnode_project }})
        [Timer]
        OnCalendar=*-*-* {{ backup_target_prune_time }}
        RandomizedDelaySec=10min
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: backup_target_units
  when: backup_target_prune | bool

- name: Temporizador de la rotación
  ansible.builtin.systemd:
    name: "{{ backup_target_unit }}.timer"
    enabled: "{{ backup_target_prune | bool }}"
    state: "{{ 'started' if backup_target_prune | bool else 'stopped' }}"
    daemon_reload: "{{ backup_target_units is changed }}"
  failed_when: false
  when: not ansible_check_mode

- name: Sin rotación, quitar su script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ backup_target_rotar }}"
    - "/etc/systemd/system/{{ backup_target_unit }}.service"
    - "/etc/systemd/system/{{ backup_target_unit }}.timer"
  when: not (backup_target_prune | bool)

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Destino de copias en https://{{ draupnode_host }}:{{ backup_target_port }}/ (solo añadir)
      para {{ backup_target_clients | length }} proyecto(s): {{ backup_target_clients | map('regex_replace', ':.*$', '') | join(', ') or 'ninguno todavía' }}.
      Copias en {{ backup_target_dir }}/datos.
      {%- if backup_target_prune | bool %} Rotación cada día a las {{ backup_target_prune_time }}: se conservan {{ backup_target_keep_days }} días{{ (' y una al mes durante ' ~ backup_target_keep_monthly ~ ' meses') if backup_target_keep_monthly | int > 0 else '' }}.
      {%- set sin = backup_target_clientes | reject('in', backup_target_con_clave) | list %}
      {%- if sin %} Todavía sin rotación para {{ sin | join(', ') }}: aplica su proyecto y después vuelve a aplicar este.{% endif %}
      {%- else %} Sin rotación: aquí no se borra ninguna copia (vigila el disco).{% endif %}
      {%- if backup_target_http.status is defined and backup_target_http.status not in [200, 401, 403, 404, 405] %} OJO: rest-server no responde ({{ backup_target_http.msg | default('') }}).{% endif %}
