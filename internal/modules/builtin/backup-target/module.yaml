id: backup-target
name: Destino de copias (rest-server)
version: 1.0.0
category: 5 · Copias
description: Convierte este servidor en el sitio donde OTROS servidores guardan sus copias. Solo deja añadir copias, nunca borrarlas, así que un intruso en el otro servidor no puede destruirlas.
details: |
  Usa rest-server (de los autores de restic, BSD-2) en Docker, con HTTPS y
  en modo «solo añadir» (--append-only): los servidores de origen pueden
  subir copias nuevas pero no borrar ni cambiar las que ya hay. Cada servidor
  de origen tiene su usuario y su carpeta y no ve las de los demás
  (--private-repos). Las copias llegan cifradas: este servidor no puede
  leerlas.
  Lo normal es no tocar esto a mano: en la página del módulo «Copias» de
  otro servidor, «Guardar también en otro servidor…» crea esta plantilla y
  deja las dos partes configuradas (usuario, contraseña y certificado).
  Rotación: con «Borrar las copias viejas» activado, ESTE servidor borra
  cada día las que pasan de los días indicados (y guarda una al mes si lo
  pides). Para eso necesita la contraseña de las copias de cada servidor:
  Draupnode se la da al aplicar (cuando ya la tiene, es decir, después de
  aplicar en el servidor de origen). Así este servidor podría leer las copias;
  si no quieres eso, desactívalo y aquí no se borrará nunca nada (vigila el
  disco).
depends: [docker]
requires:
  os: [ubuntu, debian]
  min_disk_gb: 10
firewall_ports_from: [backup_target_port]
checks:
  - container_free: backup_target_container
uninstall_warning: Para el rest-server y la rotación. Los otros servidores dejan de poder guardar aquí sus copias (fallará su copia remota hasta que elijas otro destino).
uninstall_data: Borrar también TODAS las copias guardadas aquí. Si el servidor de origen se pierde, ya no habrá de dónde restaurar.
variables:
  - name: backup_target_port
    label: Puerto HTTPS
    help: Por él se conectan los servidores de origen. Se abre en el Cortafuegos.
    type: int
    default: 8000
    min: 1024
    max: 65535
  - name: backup_target_dir
    label: Carpeta de las copias
    help: Dentro, una carpeta por servidor de origen.
    type: string
    default: /srv/draupnode/destino-copias
    pattern: '^/[A-Za-z0-9._/-]+$'
    pattern_help: Ruta absoluta
  - name: backup_target_container
    label: Nombre del contenedor
    type: string
    default: dn-destino-copias
    pattern: '^[a-z][a-z0-9_-]{1,40}$'
    pattern_help: Minúsculas, números, - y _
  - name: backup_target_clients
    label: Servidores que guardan aquí
    help: Los rellena Draupnode («nombre:huella de su contraseña»). Quitar una línea le quita el acceso; sus copias se quedan.
    type: list
    default: []
    pattern: '^[a-z0-9][a-z0-9-]{0,62}:\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$'
    pattern_help: Lo rellena Draupnode
  - name: backup_target_tls_cert
    label: Certificado HTTPS
    help: Lo genera Draupnode (en base64). Los servidores de origen lo usan para comprobar que hablan con este y no con otro.
    type: string
    default: ""
    pattern: '^[A-Za-z0-9+/=]*$'
    pattern_help: Lo rellena Draupnode
  - name: backup_target_tls_key
    label: Clave privada HTTPS
    help: La genera Draupnode y se guarda cifrada en tu bóveda.
    type: secret
    required: true
  - name: backup_target_prune
    label: Borrar las copias viejas (rotación)
    help: Este servidor borra cada día las copias que pasan de los días de abajo. Necesita la contraseña de las copias (Draupnode se la da al aplicar).
    type: bool
    default: true
  - name: backup_target_keep_days
    label: Conservar las copias de los últimos (días)
    type: int
    default: 30
    min: 1
    max: 3650
  - name: backup_target_keep_monthly
    label: Y además una copia al mes durante (meses)
    help: 0 = ninguna más.
    type: int
    default: 12
    min: 0
    max: 240
  - name: backup_target_prune_time
    label: Hora de la rotación
    help: Mejor lejos de la hora de las copias (mientras rota, el origen espera para copiar).
    type: string
    default: "05:30"
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    pattern_help: Formato HH:MM
  - name: backup_target_keys
    label: Contraseñas de las copias (las pone Draupnode)
    type: secret
    managed: true
links:
  - label: "rest-server (código fuente)"
    url: https://github.com/restic/rest-server
  - label: "restic"
    url: https://restic.net

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Hacen falta dos servidores: el de pruebas como destino y otro (un segundo Ubuntu, o un VPS) como origen. Con uno solo, comprueba solo que el destino arranca."
  pasos:
    - "No se añade a mano: en el servidor de origen (con «Copias de seguridad»), pestaña Copias → «Guardar también en otro servidor» y elige el destino."
    - "Draupnode añade este módulo al destino con su certificado y configura las copias del origen; pulsa «Aplicar los dos ahora»."
    - "En el origen, «Hacer copia ahora» y luego «Ver copias remotas»."
  comprobar:
    - "Las copias del origen aparecen en el destino."
    - "Desde el origen no se pueden borrar las del destino (modo solo añadir): un intruso en el origen no las destruye."
  necesita:
    - "Nada a mano: se configura desde el servidor que hace las copias (Copias → «Guardar también en otro servidor»), que pone el certificado y las contraseñas."
    - "10 GB libres como mínimo, y el puerto (8000 por defecto) abierto en el cortafuegos del proveedor para el servidor de origen."
  problemas:
    - "«Clave privada HTTPS: lo pone Draupnode…» en rojo → no lo añadas a mano, usa «Guardar también en otro servidor»."
    - "El origen no llega («connection refused», «timeout») → el puerto está cerrado en el proveedor de nube del destino."
    - "Cambió la IP del destino → vuelve a usar «Guardar también en otro servidor»: el certificado va ligado a la dirección."
    - "Choca con Coolify en el 8000 → cambia el puerto del destino."
