id: jellyfin
name: "Jellyfin (películas y series)"
version: 1.0.0
category: 7 · Apps
description: "Tu propio Netflix: películas, series y fotos desde el navegador, la tele o el móvil."
details: |
  Jellyfin en Docker. Lee tus vídeos de la carpeta indicada (solo
  lectura). La primera vez, entra y sigue el asistente (crea el
  administrador y añade la biblioteca «/media»).
  Convertir vídeo en directo gasta mucha CPU: mejor clientes que lo
  reproduzcan tal cual (la app de Jellyfin, Kodi…).
  Sus datos están en /srv/draupnode/apps/jellyfin (entran en las copias del
  módulo Copias). Licencia: GPL-2.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
  min_ram_mb: 1500
firewall_ports_from: [jellyfin_public_port]
proxy_site:
  domain: jellyfin_domain
  port: jellyfin_port
uninstall_warning: "Para y quita los contenedores de Jellyfin."
uninstall_data: "Borrar también sus datos (la configuración y la caché de Jellyfin (tus vídeos no se tocan)). No se puede deshacer."
variables:
  - name: jellyfin_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 8096
    min: 1024
    max: 65535
  - name: jellyfin_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el proyecto, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: jellyfin_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: jellyfin_media
    label: Carpeta de los vídeos
    type: string
    default: /srv/media
    pattern: '^/[A-Za-z0-9._/ -]+$'
    pattern_help: Ruta absoluta
  - name: jellyfin_update
    label: Actualizar Jellyfin al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://jellyfin.org
  - label: "Código fuente"
    url: https://github.com/jellyfin/jellyfin
