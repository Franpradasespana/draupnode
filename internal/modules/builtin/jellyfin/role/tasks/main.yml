---
- name: Carpeta de Jellyfin
  ansible.builtin.set_fact:
    jellyfin_dir: /srv/draupnode/apps/jellyfin
    jellyfin_url: "{{ ('https://' ~ jellyfin_domain) if jellyfin_domain else ('http://127.0.0.1:' ~ jellyfin_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpeta de los vídeos
  ansible.builtin.file:
    path: "{{ jellyfin_media }}"
    state: directory
    mode: "0755"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ jellyfin_dir }}"
    - "{{ jellyfin_dir }}/config"
    - "{{ jellyfin_dir }}/cache"

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyfin_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: false

- name: Arrancar Jellyfin
  ansible.builtin.command: docker compose -p dn-jellyfin up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ jellyfin_dir }}"
  register: jellyfin_up
  changed_when: "'Started' in jellyfin_up.stderr or 'Created' in jellyfin_up.stderr or 'Recreated' in jellyfin_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port }}/health"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: jellyfin_http
  until: jellyfin_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Jellyfin {{ 'responde' if (jellyfin_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-jellyfin logs, en ' ~ jellyfin_dir ~ ')' }} en {{ jellyfin_url }}.
      Entra y sigue el asistente: crea el administrador y añade la biblioteca /media (en el servidor: {{ jellyfin_media }}).
