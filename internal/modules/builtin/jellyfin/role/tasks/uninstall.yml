---
- name: ¿Está Jellyfin?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/jellyfin/docker-compose.yml
  register: jellyfin_cf

- name: Parar y quitar Jellyfin
  ansible.builtin.command: docker compose -p dn-jellyfin down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/jellyfin
  when: jellyfin_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/jellyfin 
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Jellyfin {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/jellyfin: si lo reinstalas, vuelve todo.' }}"
