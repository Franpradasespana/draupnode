---
# ---------------------------------------------------------------- no quedarse fuera
- name: Datos del usuario con el que entra Draupnode
  ansible.builtin.getent:
    database: passwd
    key: "{{ draupnode_ssh_user }}"
  check_mode: false

- name: ¿Tiene claves autorizadas?
  ansible.builtin.stat:
    path: "{{ getent_passwd[draupnode_ssh_user][4] }}/.ssh/authorized_keys"
  register: ssh_authkeys

- name: No quitar la contraseña si no hay ninguna clave con la que entrar
  ansible.builtin.assert:
    that: ssh_password_auth | bool or (ssh_authkeys.stat.exists and ssh_authkeys.stat.size > 0)
    fail_msg: >-
      {{ draupnode_ssh_user }} no tiene ninguna clave en ~/.ssh/authorized_keys: si se quita la
      entrada con contraseña te quedarías fuera. Añade antes tu clave pública (ssh-copy-id) o marca
      «Permitir entrar con contraseña». No se ha tocado nada.
    quiet: true

- name: No prohibir root si se entra como root
  ansible.builtin.assert:
    that: draupnode_ssh_user != 'root' or ssh_root_login != 'no'
    fail_msg: Entras como root y el módulo prohibiría entrar como root. Elige «solo-con-clave». No se ha tocado nada.
    quiet: true

- name: El usuario con el que entras tiene que estar en la lista de permitidos
  ansible.builtin.assert:
    that: ssh_allow_users | length == 0 or draupnode_ssh_user in ssh_allow_users
    fail_msg: "Falta {{ draupnode_ssh_user }} en «Solo pueden entrar estos usuarios»: te quedarías fuera. No se ha tocado nada."
    quiet: true

# ---------------------------------------------------------------- configuración
- name: sshd_config lee la carpeta sshd_config.d
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/'

- name: Carpeta sshd_config.d
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: ¿Hay iptables?
  ansible.builtin.command: which iptables
  register: ssh_iptables_bin
  changed_when: false
  failed_when: false
  check_mode: false

- name: ¿Ya está abierto el puerto {{ ssh_port }}? (p. ej. por el Cortafuegos)
  ansible.builtin.shell: iptables -S INPUT | grep -qE -- '--dport {{ ssh_port | int }} .*-j ACCEPT'
  register: ssh_port_open
  changed_when: false
  failed_when: false
  check_mode: false
  when: ssh_iptables_bin.rc == 0 and ssh_port | int != 22

# Aunque no esté el módulo Cortafuegos: en servidores como los de Oracle las
# reglas de iptables lo cierran todo salvo el 22.
- name: Abrir el puerto nuevo en iptables antes de cambiarlo
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ ssh_port }}"
    ctstate: NEW
    jump: ACCEPT
    action: insert
    comment: draupnode-ssh
  register: ssh_iptables
  when:
    - ssh_port | int != 22
    - ssh_iptables_bin.rc == 0
    - ssh_port_open.rc | default(1) != 0
    - not ansible_check_mode

- name: Guardar las reglas de iptables (si hay netfilter-persistent)
  ansible.builtin.shell: command -v netfilter-persistent >/dev/null && netfilter-persistent save || true
  when: ssh_iptables is changed

- name: Configuración de SSH
  block:
    - name: Escribir 01-draupnode.conf
      ansible.builtin.template:
        src: 01-draupnode.conf.j2
        dest: /etc/ssh/sshd_config.d/01-draupnode.conf
        mode: "0644"
        backup: true
      register: ssh_conf

    - name: Comprobar la configuración (sshd -t)
      ansible.builtin.command: sshd -t
      changed_when: false
      when: ssh_conf is changed and not ansible_check_mode
  rescue:
    - name: Volver a la configuración anterior
      ansible.builtin.shell: |
        if [ -n "{{ ssh_conf.backup_file | default('') }}" ]; then
          mv -f "{{ ssh_conf.backup_file | default('') }}" /etc/ssh/sshd_config.d/01-draupnode.conf
        else
          rm -f /etc/ssh/sshd_config.d/01-draupnode.conf
        fi
    - name: Avisar del error
      ansible.builtin.fail:
        msg: "sshd -t rechazó la configuración y se ha dejado como estaba: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) }}"

- name: Quitar la copia de seguridad de la configuración
  ansible.builtin.file:
    path: "{{ ssh_conf.backup_file }}"
    state: absent
  when: ssh_conf.backup_file is defined

- name: ¿El SSH arranca por socket (Ubuntu 24.04+)?
  ansible.builtin.command: systemctl is-enabled ssh.socket
  register: ssh_socket
  changed_when: false
  failed_when: false
  check_mode: false

# Las conexiones abiertas (la de Draupnode también) no se cortan al reiniciar.
- name: Aplicar la configuración de SSH (por socket)
  ansible.builtin.shell: systemctl daemon-reload && systemctl restart ssh.socket
  when: ssh_conf is changed and not ansible_check_mode and ssh_socket.stdout == 'enabled'

- name: Aplicar la configuración de SSH
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: "{{ 'restarted' if ssh_port | int != 22 else 'reloaded' }}"
  when: ssh_conf is changed and not ansible_check_mode and ssh_socket.stdout != 'enabled'

- name: Comprobar que el SSH escucha en el puerto {{ ssh_port }}
  ansible.builtin.wait_for:
    port: "{{ ssh_port | int }}"
    host: 127.0.0.1
    timeout: 20
  when: not ansible_check_mode

# ---------------------------------------------------------------- fail2ban
- name: fail2ban
  when: ssh_fail2ban | bool
  block:
    - name: Instalar fail2ban
      ansible.builtin.apt:
        name: [fail2ban, python3-systemd]
        state: present
        lock_timeout: 600

    - name: IPs que nunca se bloquean
      ansible.builtin.set_fact:
        ssh_ignore_all: "{{ ([lookup('ansible.builtin.env', 'DRAUPNODE_CLIENT_IP')] + ssh_fail2ban_ignore) | select | unique | list }}"

    - name: Configuración de fail2ban
      ansible.builtin.template:
        src: jail-draupnode.local.j2
        dest: /etc/fail2ban/jail.d/draupnode.local
        mode: "0644"
      notify: Reiniciar fail2ban

    - name: fail2ban arrancado y al iniciar el sistema
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
      when: not ansible_check_mode

- name: Quitar fail2ban si se ha desmarcado
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/draupnode.local
    state: absent
  when: not ssh_fail2ban | bool
  notify: Reiniciar fail2ban

- name: Nota
  ansible.builtin.debug:
    msg: >-
      {{ 'Al aplicar, el' if ansible_check_mode else 'El' }} SSH
      {{ 'escuchará' if ansible_check_mode else 'escucha' }} en el puerto {{ ssh_port }},
      {{ 'con contraseña o clave' if ssh_password_auth | bool else 'solo con clave' }},
      root: {{ ssh_root_login }}.
      {%- if ssh_fail2ban | bool %} fail2ban bloquea {{ ssh_fail2ban_bantime }} tras {{ ssh_fail2ban_maxretry }} fallos
      {%- if ssh_ignore_all | default([]) | length > 0 %} (nunca a {{ ssh_ignore_all | join(', ') }}){% endif %}.
      {%- if lookup('ansible.builtin.env', 'DRAUPNODE_CLIENT_IP') == '' %} No se ha podido saber tu IP (pasa al ejecutar tú el script con sudo): añádela en «IPs que nunca se bloquean» o lanza el script desde Draupnode.{% endif %}{% endif %}
