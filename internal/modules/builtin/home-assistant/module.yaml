id: home-assistant
name: "Home Assistant (domótica)"
version: 1.0.0
category: 7 · Apps
description: "Controla luces, enchufes, sensores y aparatos de casa desde una web y el móvil, con automatizaciones. Funciona sin la nube de cada fabricante."
details: |
  Home Assistant (la versión «Container») en Docker. La primera vez que
  entres te pide crear tu usuario: hazlo nada más aplicar.
  En un servidor en internet no ve los aparatos de tu red de casa por sí
  solo: úsalo en un servidor de casa, o une ambas redes con WireGuard o
  Headscale. Sin USB (Zigbee/Z-Wave) dentro del contenedor.
  Draupnode le dice que se fíe de Caddy/nginx (para usarlo con dominio).
  Sus datos están en /srv/draupnode/apps/home-assistant (entran en las copias del
  módulo Copias). Licencia: Apache-2.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
  min_ram_mb: 600
firewall_ports_from: [home_assistant_public_port]
proxy_site:
  domain: home_assistant_domain
  port: home_assistant_port
uninstall_warning: "Para y quita los contenedores de Home Assistant."
uninstall_data: "Borrar también sus datos (su configuración, automatizaciones e historial). No se puede deshacer."
variables:
  - name: home_assistant_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 8123
    min: 1024
    max: 65535
  - name: home_assistant_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: home_assistant_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: home_assistant_update
    label: Actualizar Home Assistant al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://www.home-assistant.io
  - label: "Instalación en Docker"
    url: https://www.home-assistant.io/installation/linux#docker-compose
  - label: "Código fuente"
    url: https://github.com/home-assistant/core

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «Home Assistant» y aplica."
    - "Pulsa «Abrir (túnel SSH)» y crea tu usuario en el asistente de inicio."
  comprobar:
    - "Entras en el panel de Home Assistant con tu usuario."
    - "Con dominio y Caddy, entras por https://tu-dominio sin error «400 Bad Request»."
  necesita:
    - "Nada para probarlo. Para tus aparatos de casa, que el servidor esté en tu red (o unido por VPN)."
  problemas:
    - "«400 Bad Request» con dominio → falta que se fíe del proxy: mira config/configuration.yaml (Draupnode lo crea solo la primera vez)."
    - "No encuentra aparatos → en un servidor de internet no ve tu red de casa."
