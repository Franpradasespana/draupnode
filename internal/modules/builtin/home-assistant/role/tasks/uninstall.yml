---
- name: ¿Está Home Assistant?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/home-assistant/docker-compose.yml
  register: home_assistant_cf

- name: Parar y quitar Home Assistant
  ansible.builtin.command: docker compose -p dn-home-assistant down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/home-assistant
  when: home_assistant_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/home-assistant 
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Home Assistant {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/home-assistant: si lo reinstalas, vuelve todo.' }}"
