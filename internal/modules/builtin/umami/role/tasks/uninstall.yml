---
- name: ¿Está Umami?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/umami/docker-compose.yml
  register: umami_cf

- name: Parar y quitar Umami
  ansible.builtin.command: docker compose -p dn-umami down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/umami
  when: umami_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/umami {{ draupnode_secrets_dir | quote }}/umami_admin {{ draupnode_secrets_dir | quote }}/.umami_admin_pass {{ draupnode_secrets_dir | quote }}/.umami_db {{ draupnode_secrets_dir | quote }}/.umami_secret
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Umami {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/umami: si lo reinstalas, vuelve todo.' }}"
