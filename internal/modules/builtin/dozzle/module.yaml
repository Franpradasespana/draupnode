id: dozzle
name: "Dozzle (registros de Docker)"
version: 1.0.0
category: 6 · Monitorización
description: "Mira en directo, desde el navegador, lo que escriben todos los contenedores (sus registros), con buscador. Muy ligero."
details: |
  Dozzle en Docker. Solo lee: no guarda nada ni toca los contenedores.
  Pide usuario y contraseña («admin», contraseña en «Contraseñas»):
  los registros pueden llevar datos delicados.
  Para guardar los registros y buscarlos días después, mejor el módulo
  «Registros» (Loki + Grafana).
  Sus datos están en /srv/draupnode/apps/dozzle (entran en las copias del
  módulo Copias). Licencia: MIT.
depends: [docker]
requires:
  os: [ubuntu, debian]
firewall_ports_from: [dozzle_public_port]
proxy_site:
  domain: dozzle_domain
  port: dozzle_port
secrets:
  - file: dozzle_admin
    label: Usuario «admin» de Dozzle
uninstall_warning: "Para y quita los contenedores de Dozzle."
uninstall_data: "Borrar también sus datos (su usuario y ajustes). No se puede deshacer."
variables:
  - name: dozzle_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 8888
    min: 1024
    max: 65535
  - name: dozzle_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: dozzle_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: dozzle_update
    label: Actualizar Dozzle al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://dozzle.dev
  - label: "Código fuente"
    url: https://github.com/amir20/dozzle

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «Dozzle» y aplica."
    - "Pulsa «Abrir (túnel SSH)» y entra con «admin» y la contraseña de «Contraseñas»."
  comprobar:
    - "Sin usuario no deja ver nada; con él, enseña todos los contenedores y sus registros en directo."
  necesita:
    - "Nada."
  problemas:
    - "No sale un contenedor → Dozzle enseña los que están en marcha; marca «Mostrar los parados» en su menú."
