---
- name: Carpeta de Dozzle
  ansible.builtin.set_fact:
    dozzle_dir: /srv/draupnode/apps/dozzle
    dozzle_url: "{{ ('https://' ~ dozzle_domain) if dozzle_domain else ('http://127.0.0.1:' ~ dozzle_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ dozzle_dir }}"
    - "{{ dozzle_dir }}/data"

- name: Contraseña «.dozzle_admin_pass» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    dozzle_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.dozzle_admin_pass', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: Usuario «admin» de Dozzle (solo cambia si cambia la contraseña)
  ansible.builtin.shell: |
    set -e
    f=/srv/draupnode/apps/dozzle/data/users.yml
    huella=$(printf '%s' "$P" | sha256sum | cut -d' ' -f1)
    [ -f "$f" ] && [ "$(cat /srv/draupnode/apps/dozzle/.huella 2>/dev/null)" = "$huella" ] && exit 0
    docker run --rm docker.io/amir20/dozzle:latest generate admin --password "$P" --email admin@localhost --name Administrador > "$f.tmp"
    grep -q '^users:' "$f.tmp"
    mv "$f.tmp" "$f"
    echo "$huella" > /srv/draupnode/apps/dozzle/.huella; chmod 600 /srv/draupnode/apps/dozzle/.huella
    echo cambiado
  environment:
    P: "{{ dozzle_admin_pass }}"
  register: dozzle_users
  changed_when: "'cambiado' in dozzle_users.stdout"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dozzle_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Dozzle
  ansible.builtin.command: docker compose -p dn-dozzle up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ dozzle_dir }}"
  register: dozzle_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: dozzle_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in dozzle_up.stderr or 'Created' in dozzle_up.stderr or 'Recreated' in dozzle_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dozzle_port }}/"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: dozzle_http
  until: dozzle_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-dozzle
  when: not ansible_check_mode

- name: Usuario y contraseña, para verlos en la app
  ansible.builtin.copy:
    dest: "{{ draupnode_secrets_dir }}/dozzle_admin"
    mode: "0600"
    content: "Usuario: admin\nContraseña: {{ dozzle_admin_pass }}\n"
  no_log: true
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Dozzle {{ 'responde' if (dozzle_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-dozzle logs, en ' ~ dozzle_dir ~ ')' }} en {{ dozzle_url }}.
      Entra con «admin» (contraseña en «Contraseñas»).
