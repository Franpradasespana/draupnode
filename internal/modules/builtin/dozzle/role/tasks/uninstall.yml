---
- name: ¿Está Dozzle?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/dozzle/docker-compose.yml
  register: dozzle_cf

- name: Parar y quitar Dozzle
  ansible.builtin.command: docker compose -p dn-dozzle down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/dozzle
  when: dozzle_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/dozzle {{ draupnode_secrets_dir | quote }}/dozzle_admin {{ draupnode_secrets_dir | quote }}/.dozzle_admin_pass
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Dozzle {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/dozzle: si lo reinstalas, vuelve todo.' }}"
