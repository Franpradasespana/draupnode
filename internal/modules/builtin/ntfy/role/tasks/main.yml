---
- name: Carpeta de ntfy
  ansible.builtin.set_fact:
    ntfy_dir: /srv/draupnode/apps/ntfy
    ntfy_url: "{{ ('https://' ~ ntfy_domain) if ntfy_domain else ('http://127.0.0.1:' ~ ntfy_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ ntfy_dir }}"
    - "{{ ntfy_dir }}/data"

- name: Contraseña «.ntfy_admin_pass» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    ntfy_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.ntfy_admin_pass', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ntfy_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar ntfy
  ansible.builtin.command: docker compose -p dn-ntfy up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ ntfy_dir }}"
  register: ntfy_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: ntfy_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in ntfy_up.stderr or 'Created' in ntfy_up.stderr or 'Recreated' in ntfy_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_port }}/v1/health"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: ntfy_http
  until: ntfy_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-ntfy
  when: not ansible_check_mode

- name: Usuario «admin» y token (la primera vez)
  ansible.builtin.shell: |
    set -e
    for i in $(seq 30); do docker exec dn-ntfy ntfy user list >/dev/null 2>&1 && break; sleep 2; done
    if ! docker exec dn-ntfy ntfy user list 2>&1 | grep -q '^user admin '; then
      docker exec -e NTFY_PASSWORD="$P" dn-ntfy ntfy user add --role=admin admin >/dev/null
      echo creado
    fi
    t="{{ draupnode_secrets_dir }}/.ntfy_token"
    if [ ! -s "$t" ]; then
      docker exec dn-ntfy ntfy token add admin 2>&1 | grep -o 'tk_[A-Za-z0-9]*' | head -n1 > "$t"
      chmod 600 "$t"; echo creado
    fi
    printf 'Usuario: admin\nContraseña: %s\nToken (para las Alertas): %s\n' "$P" "$(cat "$t")" > "{{ draupnode_secrets_dir }}/ntfy_admin"
    chmod 600 "{{ draupnode_secrets_dir }}/ntfy_admin"
  environment:
    P: "{{ ntfy_admin_pass }}"
  register: ntfy_user
  changed_when: "'creado' in ntfy_user.stdout"
  no_log: true
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      ntfy {{ 'responde' if (ntfy_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-ntfy logs, en ' ~ ntfy_dir ~ ')' }} en {{ ntfy_url }}.
      Usuario «admin» y token en «Contraseñas». Para las Alertas: servidor {{ ('https://' ~ ntfy_domain) if ntfy_domain else 'https://tu-dominio' }} y el token.
