---
- name: ¿Está ntfy?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/ntfy/docker-compose.yml
  register: ntfy_cf

- name: Parar y quitar ntfy
  ansible.builtin.command: docker compose -p dn-ntfy down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/ntfy
  when: ntfy_cf.stat.exists and not ansible_check_mode

- name: Borrar el token guardado
  ansible.builtin.file:
    path: "{{ draupnode_secrets_dir }}/.ntfy_token"
    state: absent
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/ntfy {{ draupnode_secrets_dir | quote }}/ntfy_admin
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "ntfy {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/ntfy: si lo reinstalas, vuelve todo.' }}"
