---
- name: ¿Está Syncthing?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/syncthing/docker-compose.yml
  register: syncthing_cf

- name: Parar y quitar Syncthing
  ansible.builtin.command: docker compose -p dn-syncthing down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/syncthing
  when: syncthing_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/syncthing 
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Syncthing {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/syncthing: si lo reinstalas, vuelve todo.' }}"
