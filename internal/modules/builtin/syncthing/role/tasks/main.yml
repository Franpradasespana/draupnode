---
- name: Carpeta de Syncthing
  ansible.builtin.set_fact:
    syncthing_dir: /srv/draupnode/apps/syncthing
    syncthing_url: "{{ ('https://' ~ syncthing_domain) if syncthing_domain else ('http://127.0.0.1:' ~ syncthing_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: La carpeta de datos es del usuario 1000 (el de Syncthing)
  ansible.builtin.file:
    path: /srv/draupnode/apps/syncthing/data
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ syncthing_dir }}"
    - "{{ syncthing_dir }}/data"

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ syncthing_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: false

- name: Arrancar Syncthing
  ansible.builtin.command: docker compose -p dn-syncthing up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ syncthing_dir }}"
  register: syncthing_up
  changed_when: "'Started' in syncthing_up.stderr or 'Created' in syncthing_up.stderr or 'Recreated' in syncthing_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ syncthing_port }}/rest/noauth/health"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: syncthing_http
  until: syncthing_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Syncthing {{ 'responde' if (syncthing_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-syncthing logs, en ' ~ syncthing_dir ~ ')' }} en {{ syncthing_url }}.
      Ponle usuario y contraseña al panel la primera vez (Acciones → Ajustes → GUI). Puerto de sincronización 22000/TCP y UDP.
