secrets:
- Device WireGuard configuration
prueba:
  lab: 'Yes: the test container uses your computer''s kernel, which has WireGuard. To really connect from a device you need a server reachable from outside (UDP port 51820).'
  pasos:
  - Add «WireGuard (VPN)» with the devices portatil and movil and apply.
  - 'On the module page, «See configurations»: each device''s one is there with its QR code.'
  - 'In «Terminal»: «sudo wg show».'
  comprobar:
  - wg show shows the wg0 interface with 10.8.0.1 and one peer per device.
  - 'On a public server: with the WireGuard phone app and the QR code, you connect and «ping 10.8.0.1» responds.'
  necesita:
  - 'The devices, one per line (laptop, phone…): each one will have its configuration and QR code in «See configurations».'
  - UDP port 51820 open in the cloud provider's firewall (Draupnode's only handles TCP).
  - '«Server''s public address»: empty = the one Draupnode uses to log in; if you log in through a private IP or a tunnel, set the public one.'
  problemas:
  - The phone connects but there is no traffic (a «handshake» that never arrives) → 51820/UDP is closed at the cloud provider, or the public address is not the right one.
  - No internet with the VPN on → «All traffic through the VPN» needs the server to reach the internet; turn it off if you only want to reach the panels.
