# Textos en inglés de «nginx» (los ids, variables y valores están en module.yaml).
name: nginx (web and proxy)
category: 3 · Platforms
description: Publishes your apps on your domain with nginx, the most widely used web server. HTTPS with certbot (Let's Encrypt), which renews by itself.
details: |
  nginx (BSD-2) and certbot (Apache-2) from the Ubuntu/Debian repositories.
  Each line in «Sites» is «domain target»:
    photos.example.com 127.0.0.1:2283      → forwards to the app on that port
    blog.example.com /srv/www/blog         → serves that folder (static website)
  Each site goes in its own file /etc/nginx/sites-available/draupnode-<domain>.conf;
  yours (the ones not starting with draupnode-) are not touched.
  With HTTPS, certbot requests each domain's certificate and redirects http→https.
  The domain must already point to this server's IP: if not, that site
  stays on http and you are warned (applying again retries it).
  Before reloading, the configuration is checked (nginx -t): if it fails, the
  previous one is restored.
  If you don't know which to choose, Caddy is simpler; nginx is the best known.
  It cannot go with Coolify or Caddy: all three want ports 80 and 443.
uninstall_warning: Uninstalls nginx and certbot. Your sites can no longer be seen through their domain; the apps behind keep running.
uninstall_data: Also delete the Let's Encrypt certificates (/etc/letsencrypt) and the nginx configuration.
variables:
  nginx_sites:
    label: Sites
    help: 'One line per site: «domain target». Target = 127.0.0.1:PORT (an app) or /folder (static website).'
    pattern_help: 'Example: photos.example.com 127.0.0.1:2283'
    placeholder: photos.example.com 127.0.0.1:2283
  nginx_https:
    label: HTTPS with Let's Encrypt (certbot)
  nginx_email:
    label: Email for Let's Encrypt
    help: Required with HTTPS. They warn you if a certificate cannot be renewed.
    pattern_help: A valid email or empty
  nginx_max_body_mb:
    label: Maximum upload size (MB)
    help: What can be uploaded at once (photos, documents…).
  nginx_remove_default:
    label: Remove the «Welcome to nginx» page
  nginx_security_headers:
    label: Security headers
    help: Not letting the website be framed by another, not guessing file types, not revealing the nginx version…
links:
- Official website
- Source code
- certbot (Let's Encrypt)
prueba:
  lab: 'Yes, but without certbot (the test server is not reachable from the internet): turn off HTTPS for the test. With a real domain it is tested on a public server.'
  pasos:
  - First install something that listens, for example «Vaultwarden» (port 8222).
  - Add «nginx» with the site «vault.localhost 127.0.0.1:8222», HTTPS off, and apply.
  - |-
    In «Terminal»: «curl -s -H 'Host: vault.localhost' http://127.0.0.1 -o /dev/null -w '%{http_code}
    '» and the same with another domain.
  comprobar:
  - With vault.localhost it returns 200; with a domain it does not know, nginx drops the connection (000).
  - '«curl -sI -H ''Host: vault.localhost'' http://127.0.0.1» does not show the nginx version and has the security headers.'
  necesita:
  - 'The sites, one per line: «domain target» (127.0.0.1:PORT or /folder).'
  - With HTTPS on, the email is required (certbot) and the domain must point to the server with 80 and 443 open.
  problemas:
  - certbot fails («Challenge failed», «DNS problem») → the domain does not point here yet or 80 is closed at the provider; to test without a domain, turn off HTTPS.
  - 'A domain not in the list does not respond → that is on purpose: nginx drops connections to domains it does not know.'
  - Uploading large files gives «413» → raise «Maximum upload size (MB)».
