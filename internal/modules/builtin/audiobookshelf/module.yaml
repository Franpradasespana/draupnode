id: audiobookshelf
name: "Audiobookshelf (audiolibros y pódcasts)"
version: 1.0.0
category: 7 · Apps
description: "Tus audiolibros y pódcasts en tu servidor, con apps para el móvil que recuerdan por dónde ibas."
details: |
  Audiobookshelf en Docker. Draupnode crea el usuario «root» (el
  administrador) con la contraseña generada en el servidor (en
  «Contraseñas»). Sube los audiolibros a
  /srv/draupnode/apps/audiobookshelf/audiolibros (una carpeta por libro)
  y los pódcasts se descargan solos en .../podcasts.
  Sus datos están en /srv/draupnode/apps/audiobookshelf (entran en las copias del
  módulo Copias). Licencia: GPL-3.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
firewall_ports_from: [audiobookshelf_public_port]
proxy_site:
  domain: audiobookshelf_domain
  port: audiobookshelf_port
secrets:
  - file: audiobookshelf_admin
    label: Usuario «root» de Audiobookshelf
uninstall_warning: "Para y quita los contenedores de Audiobookshelf."
uninstall_data: "Borrar también sus datos (la biblioteca, los audiolibros, los pódcasts y el progreso de cada usuario). No se puede deshacer."
variables:
  - name: audiobookshelf_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 13378
    min: 1024
    max: 65535
  - name: audiobookshelf_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: audiobookshelf_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: audiobookshelf_update
    label: Actualizar Audiobookshelf al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://www.audiobookshelf.org
  - label: "Código fuente"
    url: https://github.com/advplyr/audiobookshelf

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «Audiobookshelf» y aplica."
    - "Pulsa «Abrir (túnel SSH)», entra con «root» y crea una biblioteca con la carpeta /audiobooks."
  comprobar:
    - "Entras con «root» y la contraseña de «Contraseñas»."
    - "Un audiolibro copiado en /srv/draupnode/apps/audiobookshelf/audiolibros sale en la biblioteca al escanearla."
  necesita:
    - "Nada."
  problemas:
    - "Te pide crear el usuario root → la primera aplicación no llegó a crearlo: vuelve a aplicar."
    - "No aparecen los libros → cada libro en su propia carpeta y pulsa «Scan» en la biblioteca."
