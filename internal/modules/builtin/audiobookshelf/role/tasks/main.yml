---
- name: Carpeta de Audiobookshelf
  ansible.builtin.set_fact:
    audiobookshelf_dir: /srv/draupnode/apps/audiobookshelf
    audiobookshelf_url: "{{ ('https://' ~ audiobookshelf_domain) if audiobookshelf_domain else ('http://127.0.0.1:' ~ audiobookshelf_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ audiobookshelf_dir }}"
    - "{{ audiobookshelf_dir }}/config"
    - "{{ audiobookshelf_dir }}/metadata"
    - "{{ audiobookshelf_dir }}/audiolibros"
    - "{{ audiobookshelf_dir }}/podcasts"

- name: Contraseña «.audiobookshelf_admin_pass» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    audiobookshelf_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.audiobookshelf_admin_pass', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ audiobookshelf_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Audiobookshelf
  ansible.builtin.command: docker compose -p dn-audiobookshelf up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ audiobookshelf_dir }}"
  register: audiobookshelf_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: audiobookshelf_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in audiobookshelf_up.stderr or 'Created' in audiobookshelf_up.stderr or 'Recreated' in audiobookshelf_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ audiobookshelf_port }}/healthcheck"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: audiobookshelf_http
  until: audiobookshelf_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-audiobookshelf
  when: not ansible_check_mode

- name: ¿Está sin estrenar?
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ audiobookshelf_port }}/status"
  register: audiobookshelf_st
  when: not ansible_check_mode

- name: Crear el usuario «root»
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ audiobookshelf_port }}/init"
    method: POST
    body_format: json
    body:
      newRoot:
        username: root
        password: "{{ audiobookshelf_admin_pass }}"
    status_code: [200, 204]
  changed_when: true
  no_log: true
  when: not ansible_check_mode and not (audiobookshelf_st.json.isInit | default(true))

- name: Usuario y contraseña, para verlos en la app
  ansible.builtin.copy:
    dest: "{{ draupnode_secrets_dir }}/audiobookshelf_admin"
    mode: "0600"
    content: "Usuario: root\nContraseña: {{ audiobookshelf_admin_pass }}\n"
  no_log: true
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Audiobookshelf {{ 'responde' if (audiobookshelf_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-audiobookshelf logs, en ' ~ audiobookshelf_dir ~ ')' }} en {{ audiobookshelf_url }}.
      Entra con «root» (contraseña en «Contraseñas») y crea una biblioteca con la carpeta /audiobooks.
