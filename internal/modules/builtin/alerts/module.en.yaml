# Textos en inglés de «alerts» (los ids, variables y valores están en module.yaml).
name: Alerts to your phone
category: 6 · Monitoring
description: Warns you on your phone when something goes wrong (disk almost full, a backup that failed, a container down, another server not responding) and when it gets fixed.
details: |
  A small script on the server (systemd, every few minutes) checks what
  you tick and sends the alert through ntfy (open source: the ntfy phone
  app, with ntfy.sh or your own ntfy server) or Telegram.
  It warns once when a problem starts, reminds you every few hours if it
  continues, and warns when it is fixed.
  With ntfy, if you leave the topic empty a long secret one is generated (whoever knows
  the name can read the alerts). On this module's page you have the QR code
  to subscribe from the app and a button to send a test alert.
  A server cannot warn that it has gone down itself: for that, put its
  address in «Watch other servers» in the alerts of ANOTHER server, or
  tick «Daily notice»: if one day it does not arrive, something is wrong.
uninstall_warning: Removes the alerts script and timer. You will stop receiving alerts from this server.
variables:
  alerts_channel:
    label: How to alert
    help: «ntfy» = the ntfy phone app (open source). «telegram» = a Telegram bot.
  alerts_ntfy_server:
    label: ntfy server
    help: The public one (https://ntfy.sh) or yours.
    pattern_help: An http(s):// address
  alerts_ntfy_topic:
    label: ntfy topic
    help: Empty = a secret one is generated on the server (recommended).
    pattern_help: Letters, numbers, - and _
  alerts_ntfy_token:
    label: ntfy token
    help: Only if your ntfy server asks for a user (access token «tk_…»).
  alerts_telegram_token:
    label: Telegram bot token
    help: The one @BotFather gives you when you create the bot.
  alerts_telegram_chat:
    label: Telegram chat
    help: Your chat number (write to the bot and check it with @userinfobot).
    pattern_help: A number
  alerts_disk_percent:
    label: Alert if a disk goes over (%)
    help: 0 = do not alert.
  alerts_ram_percent:
    label: Alert if memory goes over (%)
    help: For two checks in a row. 0 = do not alert.
  alerts_backups:
    label: Alert if a backup fails
    help: Or if the last good one is more than 36 hours old.
  alerts_containers:
    label: Alert if a container goes down
    help: Stopped with an error, restarting non-stop or «unhealthy».
  alerts_services:
    label: Alert if a system service fails
    help: Any systemd service in «failed» state.
  alerts_watch:
    label: Watch other servers
    help: 'One per line: address:port (e.g. 203.0.113.40:22). It warns if it stops responding.'
    pattern_help: address:port
  alerts_daily:
    label: Daily notice that all is well
    help: At 9:00. If one day it does not arrive, the server may be down.
  alerts_interval_min:
    label: Check every (minutes)
  alerts_repeat_hours:
    label: Remind about an ongoing problem every (hours)
    help: 0 = do not remind.
links:
- ntfy
- ntfy source code
- Telegram bots
secrets:
- ntfy topic (to subscribe)
prueba:
  lab: 'Yes, with ntfy (no account): the alert reaches the phone even from the test server, because it is the server that calls ntfy.sh. Telegram needs a bot (@BotFather) and your chat id.'
  pasos:
  - Add «Alerts to your phone» with the ntfy channel and apply.
  - 'On the module page: «Subscribe on your phone» (QR code for the ntfy app) and «Send a test alert».'
  - Press «What it sees now». To force an alert, stop a container in the Containers tab and wait 5 minutes.
  comprobar:
  - The test alert reaches the phone.
  - «What it sees now» shows disk, memory, backups and containers with their status.
  - When you stop the container an alert arrives, and another when you start it again.
  necesita:
  - 'With ntfy: nothing (the secret topic is generated by itself). Then «Subscribe on your phone» with the ntfy app.'
  - 'With Telegram: the bot token (@BotFather gives it to you) and your chat number (write to the bot and check it with @userinfobot).'
  - 'Optional: disk and RAM thresholds, and other servers to watch («IP:port», one per line).'
  problemas:
  - Nothing arrives → press «Send a test alert»; if that does not arrive either, the server cannot reach the internet or the topic/token is wrong.
  - Nothing arrives on Telegram → first send /start to your bot (bots cannot write to someone who has not talked to them).
  - Repeated alerts arrive → they repeat every «Remind about an ongoing problem every (hours)» while it is still wrong; raise it if it bothers you.
