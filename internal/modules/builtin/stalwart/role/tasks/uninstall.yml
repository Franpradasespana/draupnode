---
- name: ¿Está Stalwart?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/stalwart/docker-compose.yml
  register: stalwart_cf

- name: Parar y quitar Stalwart
  ansible.builtin.command: docker compose -p dn-stalwart down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/stalwart
  when: stalwart_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/stalwart {{ draupnode_secrets_dir | quote }}/stalwart_admin
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Stalwart {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/stalwart: si lo reinstalas, vuelve todo.' }}"
