id: adguard
name: AdGuard Home (sin anuncios en la VPN)
version: 1.0.0
category: 7 · Apps
description: "Bloquea anuncios, rastreadores y webs peligrosas en todos tus dispositivos conectados a la VPN, sin instalar nada en ellos."
details: |
  AdGuard Home (GPL-3) en Docker. Su DNS solo escucha en la VPN (la .1 de
  WireGuard), nunca en internet: un DNS abierto se usa para atacar a otros.
  Draupnode pone su dirección como DNS de los dispositivos de la VPN (hay
  que volver a escanear el QR o importar su .conf).
  Su panel solo se ve desde el servidor: «Abrir» en la página del módulo
  (túnel SSH), por la VPN o con dominio. Usuario y contraseña generados en
  el servidor (en «Contraseñas»).
  Las consultas salen cifradas (DNS sobre HTTPS) a Quad9 y Cloudflare;
  puedes cambiarlo en su panel.
depends: [docker, wireguard]
requires:
  os: [ubuntu, debian]
proxy_site:
  domain: adguard_domain
  port: adguard_port
secrets:
  - file: adguard_usuario
    label: Usuario del panel de AdGuard Home
uninstall_warning: Para AdGuard Home. Los dispositivos de la VPN se quedan sin DNS hasta que quites el DNS de WireGuard y vuelvas a aplicar.
uninstall_data: Borrar también su configuración y estadísticas.
variables:
  - name: adguard_port
    label: Puerto del panel (solo local)
    type: int
    default: 3080
    min: 1024
    max: 65535
  - name: adguard_domain
    label: Dominio del panel
    help: Opcional. Con Caddy o nginx en el servidor, el panel se publica en https://dominio.
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio o vacío
  - name: adguard_update
    label: Actualizar AdGuard Home al aplicar
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://adguard.com/adguard-home/overview.html
  - label: "Código fuente"
    url: https://github.com/AdguardTeam/AdGuardHome

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí (necesita WireGuard)."
  pasos:
    - "Con WireGuard instalado, añade «AdGuard Home» y aplica."
    - "En «Terminal»: «sudo apt-get install -y dnsutils», luego «dig +short @10.8.0.1 doubleclick.net» y «dig +short @10.8.0.1 example.com»."
    - "Pulsa «Abrir (túnel SSH)» y entra con el usuario de Contraseñas."
  comprobar:
    - "doubleclick.net devuelve 0.0.0.0 (bloqueado) y example.com su IP real."
    - "El panel de AdGuard carga y cuenta las consultas; las configuraciones de WireGuard llevan DNS = 10.8.0.1."
  necesita:
    - "Nada (necesita WireGuard): los dispositivos de la VPN usan su DNS solos. El usuario del panel está en Contraseñas."
  problemas:
    - "No bloquea anuncios → el dispositivo no está usando la VPN, o su configuración es anterior a AdGuard: vuelve a importar la de «Ver configuraciones» (lleva DNS = 10.8.0.1)."
    - "Una web legítima no carga → añádela a la lista blanca en el panel de AdGuard."
