---
- name: Parar la revisión semanal
  ansible.builtin.systemd:
    name: draupnode-trivy.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not ansible_check_mode

- name: Quitar el script y las unidades
  ansible.builtin.shell: |
    rm -f /usr/local/sbin/draupnode-trivy /etc/systemd/system/draupnode-trivy.service /etc/systemd/system/draupnode-trivy.timer
    systemctl daemon-reload
  when: not ansible_check_mode

- name: Quitar Trivy
  ansible.builtin.apt:
    name: trivy
    state: absent
    lock_timeout: 600

- name: Quitar el repositorio
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/etc/apt/sources.list.d/trivy.list, /etc/apt/keyrings/trivy.asc]

- name: Borrar la base y los informes
  ansible.builtin.shell: rm -rf /var/cache/draupnode-trivy /var/lib/draupnode/trivy
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Trivy {{ 'se quitará' if ansible_check_mode else 'quitado' }}."
