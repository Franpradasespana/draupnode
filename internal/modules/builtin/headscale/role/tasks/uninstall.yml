---
- name: ¿Está Headscale?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/headscale/docker-compose.yml
  register: headscale_cf

- name: Parar y quitar Headscale
  ansible.builtin.command: docker compose -p dn-headscale down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/headscale
  when: headscale_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/headscale {{ draupnode_secrets_dir | quote }}/headscale_clave
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Headscale {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/headscale: si lo reinstalas, vuelve todo.' }}"
