id: paperless
name: "Paperless-ngx (documentos)"
version: 1.0.0
category: 7 · Apps
description: "Escanea o sube tus papeles (facturas, contratos, recibos…) y encuéntralos al momento: lee el texto (OCR), los etiqueta y los archiva."
details: |
  Paperless-ngx en Docker, con su propio PostgreSQL y Redis. Draupnode
  crea el usuario «admin» con una contraseña generada en el servidor (en
  «Contraseñas»). Lo que dejes en la carpeta «consume» (por
  ejemplo con Syncthing o desde el escáner) se importa solo.
  La primera vez tarda unos minutos en arrancar.
  Sus datos están en /srv/draupnode/apps/paperless (entran en las copias del
  módulo Copias). Licencia: GPL-3.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
  min_ram_mb: 2000
firewall_ports_from: [paperless_public_port]
proxy_site:
  domain: paperless_domain
  port: paperless_port
secrets:
  - file: paperless_admin
    label: Usuario «admin» de Paperless-ngx
uninstall_warning: "Para y quita los contenedores de Paperless-ngx."
uninstall_data: "Borrar también sus datos (todos los documentos, su base de datos y sus etiquetas). No se puede deshacer."
variables:
  - name: paperless_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 8010
    min: 1024
    max: 65535
  - name: paperless_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: paperless_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: paperless_ocr_language
    label: Idioma de los documentos (OCR)
    type: select
    options: [spa, spa+eng, eng, cat, spa+cat]
    default: spa+eng
  - name: paperless_update
    label: Actualizar Paperless-ngx al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Documentación"
    url: https://docs.paperless-ngx.com
  - label: "Código fuente"
    url: https://github.com/paperless-ngx/paperless-ngx
