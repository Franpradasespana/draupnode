---
- name: Carpeta de Paperless-ngx
  ansible.builtin.set_fact:
    paperless_dir: /srv/draupnode/apps/paperless
    paperless_url: "{{ ('https://' ~ paperless_domain) if paperless_domain else ('http://127.0.0.1:' ~ paperless_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # La de PostgreSQL la deja la imagen en 0700: no se toca (si no, cambiaría en cada aplicación).
    mode: "{{ omit if item.endswith('/pgdata') else '0750' }}"
  loop:
    - "{{ paperless_dir }}"
    - "{{ paperless_dir }}/data"
    - "{{ paperless_dir }}/media"
    - "{{ paperless_dir }}/export"
    - "{{ paperless_dir }}/consume"
    - "{{ paperless_dir }}/pgdata"

- name: Contraseña «paperless_admin» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    paperless_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/paperless_admin', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: Contraseña «.paperless_secret_key» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    paperless_secret_key: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.paperless_secret_key', chars=['ascii_letters', 'digits'], length=50) }}"
  no_log: true
  when: not ansible_check_mode

- name: Contraseña «.paperless_db» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    paperless_db_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.paperless_db', chars=['ascii_letters', 'digits'], length=32) }}"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Paperless-ngx
  ansible.builtin.command: docker compose -p dn-paperless up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ paperless_dir }}"
  register: paperless_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: paperless_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in paperless_up.stderr or 'Created' in paperless_up.stderr or 'Recreated' in paperless_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ paperless_port }}/accounts/login/"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: paperless_http
  until: paperless_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 100
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-paperless
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Paperless-ngx {{ 'responde' if (paperless_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-paperless logs, en ' ~ paperless_dir ~ ')' }} en {{ paperless_url }}.
      Entra con «admin» (contraseña en «Contraseñas del proyecto»). Lo que pongas en {{ paperless_dir }}/consume se importa solo.
