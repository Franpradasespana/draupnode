id: postgres
name: PostgreSQL compartido
version: 1.0.0
category: 4 · Bases de datos
description: Un PostgreSQL en Docker para todas tus apps, con una base y un usuario por app. Las contraseñas se generan en el servidor.
details: |
  Solo es accesible desde la red Docker indicada (las apps lo ven por el nombre
  del contenedor). Las contraseñas se generan en el propio servidor la primera
  vez y se guardan en /etc/draupnode/secretos/<proyecto>/ (solo root); nunca se
  pisan al relanzar.
depends: [docker]
requires:
  os: [ubuntu, debian]
  min_ram_mb: 900
checks:
  - container_free: postgres_container
secrets:
  - file: postgres_superusuario
    label: Superusuario «postgres»
  - file: postgres_*
    label: Usuario de la base
uninstall_warning: Para y quita el contenedor de PostgreSQL. Las apps que lo usan dejan de tener base de datos.
uninstall_data: Borrar también los DATOS de todas las bases y sus contraseñas. No se puede deshacer.
variables:
  - name: postgres_version
    label: Versión de PostgreSQL
    type: select
    options: ["15", "16", "17"]
    default: "16"
  - name: postgres_container
    label: Nombre del contenedor
    help: Es el «host» con el que tus apps se conectan.
    type: string
    default: pg-compartido
    pattern: '^[a-z][a-z0-9_-]{1,40}$'
    pattern_help: Minúsculas, números, - y _
  - name: postgres_network
    label: Red Docker compartida
    type: string
    default: apps
    pattern: '^[a-z][a-z0-9_-]{1,40}$'
    pattern_help: Minúsculas, números, - y _
  - name: postgres_databases
    label: Bases de datos
    help: Una por línea. Cada una tendrá un usuario con el mismo nombre y su propia contraseña.
    type: list
    default: []
    pattern: '^[a-z][a-z0-9_]{0,30}$'
    pattern_help: Minúsculas, números y _ (empezando por letra)
  - name: postgres_dir
    label: Carpeta en el servidor
    type: string
    default: /srv/draupnode/postgres
    pattern: '^/[A-Za-z0-9._/-]+$'
    pattern_help: Ruta absoluta
links:
  - label: "Web oficial"
    url: https://www.postgresql.org
  - label: "Documentación"
    url: https://www.postgresql.org/docs/
  - label: "Código fuente"
    url: https://github.com/postgres/postgres

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «PostgreSQL compartido» con una base, por ejemplo «tienda», y aplica."
    - "Mira el usuario y la contraseña de «tienda» en la página del módulo → Contraseñas."
    - "En «Terminal»: «docker exec -it pg-compartido psql -U tienda -d tienda -c 'select 1'»."
  comprobar:
    - "La consulta devuelve 1."
    - "Ficha → Apps y bases → Bases de datos: sale pg-compartido con la base «tienda» y lo que pesa."
    - "Si desinstalas sin «borrar datos» y vuelves a instalar, la base y su contraseña siguen ahí."
