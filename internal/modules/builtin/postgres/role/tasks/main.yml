---
- name: Carpeta de PostgreSQL
  ansible.builtin.file:
    path: "{{ postgres_dir }}"
    state: directory
    mode: "0700"

- name: Contraseña del superusuario (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    postgres_super_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/postgres_superusuario', chars=['ascii_letters', 'digits'], length=32) }}"
  no_log: true
  when: not ansible_check_mode

- name: Red Docker «{{ postgres_network }}»
  ansible.builtin.shell: docker network inspect {{ postgres_network | quote }} >/dev/null 2>&1 || { docker network create {{ postgres_network | quote }} >/dev/null && echo creada; }
  register: postgres_red
  changed_when: "'creada' in postgres_red.stdout"

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ postgres_dir }}/docker-compose.yml"
    mode: "0600"

- name: Fichero .env con la contraseña
  ansible.builtin.copy:
    dest: "{{ postgres_dir }}/.env"
    mode: "0600"
    content: "POSTGRES_PASSWORD={{ postgres_super_pass }}\n"
  no_log: true
  when: not ansible_check_mode

- name: Arrancar PostgreSQL
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ postgres_dir }}"
  register: postgres_up
  changed_when: "'Started' in postgres_up.stderr or 'Created' in postgres_up.stderr or 'Recreated' in postgres_up.stderr"
  # Al previsualizar la carpeta puede no existir aún (el módulo command falla
  # al entrar en ella aunque no vaya a ejecutar nada).
  when: not ansible_check_mode

- name: Esperar a que PostgreSQL acepte conexiones
  ansible.builtin.command: docker exec {{ postgres_container | quote }} pg_isready -U postgres
  register: postgres_listo
  until: postgres_listo.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  when: not ansible_check_mode

- name: Contraseñas de cada base (se generan en el servidor la primera vez)
  ansible.builtin.set_fact:
    postgres_db_pass: "{{ postgres_db_pass | default({}) | combine({item: lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/postgres_' ~ item, chars=['ascii_letters', 'digits'], length=32)}) }}"
  loop: "{{ postgres_databases }}"
  no_log: true
  when: not ansible_check_mode

- name: Usuario de cada base
  ansible.builtin.command:
    cmd: docker exec -i {{ postgres_container | quote }} psql -U postgres -v ON_ERROR_STOP=1 -q
    stdin: |
      DO $$ BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ item }}') THEN
          CREATE ROLE {{ item }} LOGIN PASSWORD '{{ postgres_db_pass[item] }}';
        ELSE
          ALTER ROLE {{ item }} WITH LOGIN PASSWORD '{{ postgres_db_pass[item] }}';
        END IF;
      END $$;
  loop: "{{ postgres_databases }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
  changed_when: false
  when: not ansible_check_mode

- name: Crear cada base
  ansible.builtin.shell: |
    docker exec {{ postgres_container | quote }} psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ item }}'" | grep -q 1 \
      || { docker exec {{ postgres_container | quote }} psql -U postgres -v ON_ERROR_STOP=1 -qc "CREATE DATABASE {{ item }} OWNER {{ item }};" && echo creada; }
  register: postgres_bd
  changed_when: "'creada' in postgres_bd.stdout"
  loop: "{{ postgres_databases }}"
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      PostgreSQL «{{ postgres_container }}» en la red Docker «{{ postgres_network }}».
      Contraseñas en {{ draupnode_secrets_dir }}/ (solo root):
      postgres_superusuario{% for d in postgres_databases %}, postgres_{{ d }}{% endfor %}.
