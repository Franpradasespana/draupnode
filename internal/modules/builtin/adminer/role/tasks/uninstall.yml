---
- name: ¿Está Adminer?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/adminer/docker-compose.yml
  register: adminer_cf

- name: Parar y quitar Adminer
  ansible.builtin.command: docker compose -p dn-adminer down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/adminer
  when: adminer_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/adminer 
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Adminer {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/adminer: si lo reinstalas, vuelve todo.' }}"
