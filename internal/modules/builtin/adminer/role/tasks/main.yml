---
- name: Carpeta de Adminer
  ansible.builtin.set_fact:
    adminer_dir: /srv/draupnode/apps/adminer
    adminer_url: "{{ ('https://' ~ adminer_domain) if adminer_domain else ('http://127.0.0.1:' ~ adminer_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Red de Docker compartida «{{ adminer_network }}» (la de las bases de datos)
  ansible.builtin.shell: docker network inspect {{ adminer_network | quote }} >/dev/null 2>&1 || { docker network create {{ adminer_network | quote }} >/dev/null && echo creada; }
  register: red_compartida
  changed_when: "'creada' in red_compartida.stdout"
  when: not ansible_check_mode

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ adminer_dir }}"


- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ adminer_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: false

- name: Arrancar Adminer
  ansible.builtin.command: docker compose -p dn-adminer up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ adminer_dir }}"
  register: adminer_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: adminer_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in adminer_up.stderr or 'Created' in adminer_up.stderr or 'Recreated' in adminer_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adminer_port }}/"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: adminer_http
  until: adminer_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-adminer
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Adminer {{ 'responde' if (adminer_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-adminer logs, en ' ~ adminer_dir ~ ')' }} en {{ adminer_url }}.
      Servidor: pg-compartido o mariadb-compartido (o el contenedor de tu app), con su usuario y contraseña.
