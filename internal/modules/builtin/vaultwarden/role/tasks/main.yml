---
- name: Carpeta de Vaultwarden
  ansible.builtin.set_fact:
    vaultwarden_dir: /srv/draupnode/apps/vaultwarden
    vaultwarden_url: "{{ ('https://' ~ vaultwarden_domain) if vaultwarden_domain else ('http://127.0.0.1:' ~ vaultwarden_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ vaultwarden_dir }}"
    - "{{ vaultwarden_dir }}/data"

- name: Contraseña «vaultwarden_admin_token» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    vaultwarden_admin_token: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/vaultwarden_admin_token', chars=['ascii_letters', 'digits'], length=48) }}"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Vaultwarden
  ansible.builtin.command: docker compose -p dn-vaultwarden up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ vaultwarden_dir }}"
  register: vaultwarden_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: vaultwarden_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in vaultwarden_up.stderr or 'Created' in vaultwarden_up.stderr or 'Recreated' in vaultwarden_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vaultwarden_port }}/alive"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: vaultwarden_http
  until: vaultwarden_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Vaultwarden {{ 'responde' if (vaultwarden_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-vaultwarden logs, en ' ~ vaultwarden_dir ~ ')' }} en {{ vaultwarden_url }}.
      {{ 'Registro ABIERTO: cuando tengáis las cuentas, desactiva «Permitir registrarse» y aplica.' if vaultwarden_signups | bool else 'Registro cerrado.' }} Panel de administración en /admin (token en «Contraseñas del proyecto»).
