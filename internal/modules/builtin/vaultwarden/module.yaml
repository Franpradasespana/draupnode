id: vaultwarden
name: "Vaultwarden (contraseñas)"
version: 1.0.0
category: 7 · Apps
description: "Tu gestor de contraseñas, compatible con las apps y extensiones de Bitwarden. Tus contraseñas, en tu servidor."
details: |
  Vaultwarden (servidor libre compatible con Bitwarden) en Docker.
  Necesita HTTPS: ponle dominio (con Caddy o nginx en el servidor) o entra
  por la VPN/«Abrir» (127.0.0.1 también vale como seguro).
  Crea tu cuenta y, cuando estéis todos, desactiva «Permitir registrarse»
  y vuelve a aplicar. El panel /admin usa el «Token de administración»
  (en «Contraseñas»).
  Sus datos están en /srv/draupnode/apps/vaultwarden (entran en las copias del
  módulo Copias). Licencia: AGPL-3.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
firewall_ports_from: [vaultwarden_public_port]
proxy_site:
  domain: vaultwarden_domain
  port: vaultwarden_port
secrets:
  - file: vaultwarden_admin_token
    label: Token del panel /admin de Vaultwarden
uninstall_warning: "Para y quita los contenedores de Vaultwarden."
uninstall_data: "Borrar también sus datos (la bóveda cifrada de todos los usuarios). No se puede deshacer."
variables:
  - name: vaultwarden_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 8222
    min: 1024
    max: 65535
  - name: vaultwarden_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: vaultwarden_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: vaultwarden_signups
    label: Permitir registrarse
    help: Déjalo activado para crear vuestras cuentas; luego desactívalo y aplica.
    type: bool
    default: true
  - name: vaultwarden_update
    label: Actualizar Vaultwarden al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Código fuente y wiki"
    url: https://github.com/dani-garcia/vaultwarden
  - label: "Apps de Bitwarden"
    url: https://bitwarden.com/download/
