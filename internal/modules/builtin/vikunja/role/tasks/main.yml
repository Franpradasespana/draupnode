---
- name: Carpeta de Vikunja
  ansible.builtin.set_fact:
    vikunja_dir: /srv/draupnode/apps/vikunja
    vikunja_url: "{{ ('https://' ~ vikunja_domain) if vikunja_domain else ('http://127.0.0.1:' ~ vikunja_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Las carpetas de datos son del usuario 1000 (el de Vikunja)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - /srv/draupnode/apps/vikunja/files
    - /srv/draupnode/apps/vikunja/db

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ vikunja_dir }}"
    - "{{ vikunja_dir }}/files"
    - "{{ vikunja_dir }}/db"

- name: Contraseña «.vikunja_jwt» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    vikunja_jwt: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.vikunja_jwt', chars=['ascii_letters', 'digits'], length=48) }}"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vikunja_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Vikunja
  ansible.builtin.command: docker compose -p dn-vikunja up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ vikunja_dir }}"
  register: vikunja_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: vikunja_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in vikunja_up.stderr or 'Created' in vikunja_up.stderr or 'Recreated' in vikunja_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vikunja_port }}/api/v1/info"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: vikunja_http
  until: vikunja_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-vikunja
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Vikunja {{ 'responde' if (vikunja_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-vikunja logs, en ' ~ vikunja_dir ~ ')' }} en {{ vikunja_url }}.
      {{ 'Registro ABIERTO: cuando tengáis las cuentas, desactiva «Permitir registrarse» y aplica.' if vikunja_registration | bool else 'Registro cerrado.' }}
