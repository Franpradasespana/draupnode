---
- name: ¿Está Vikunja?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/vikunja/docker-compose.yml
  register: vikunja_cf

- name: Parar y quitar Vikunja
  ansible.builtin.command: docker compose -p dn-vikunja down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/vikunja
  when: vikunja_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/vikunja 
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Vikunja {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/vikunja: si lo reinstalas, vuelve todo.' }}"
