id: vikunja
name: "Vikunja (tareas y proyectos)"
version: 1.0.0
category: 7 · Apps
description: "Listas de tareas y proyectos (lista, tablero Kanban, Gantt y tabla), compartidas con tu familia o tu equipo. Como Todoist o Trello, pero tuyo."
details: |
  Vikunja en Docker, con su base SQLite (sin servidor de base de datos
  aparte). Crea tu cuenta y, cuando estéis todos, desactiva «Permitir
  registrarse» y vuelve a aplicar.
  Sus datos están en /srv/draupnode/apps/vikunja (entran en las copias del
  módulo Copias). Licencia: AGPL-3.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
firewall_ports_from: [vikunja_public_port]
proxy_site:
  domain: vikunja_domain
  port: vikunja_port
uninstall_warning: "Para y quita los contenedores de Vikunja."
uninstall_data: "Borrar también sus datos (todas las tareas, proyectos, adjuntos y usuarios). No se puede deshacer."
variables:
  - name: vikunja_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 3456
    min: 1024
    max: 65535
  - name: vikunja_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: vikunja_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: vikunja_registration
    label: Permitir registrarse
    help: Déjalo activado para crear vuestras cuentas; luego desactívalo y aplica.
    type: bool
    default: true
  - name: vikunja_update
    label: Actualizar Vikunja al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://vikunja.io
  - label: "Código fuente"
    url: https://github.com/go-vikunja/vikunja

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «Vikunja» y aplica."
    - "Pulsa «Abrir (túnel SSH)», regístrate, crea un proyecto y una tarea. Después desactiva «Permitir registrarse» y aplica."
  comprobar:
    - "La tarea se guarda y se ve en lista y en tablero."
    - "Con el registro cerrado, la página ya no deja crear cuentas nuevas."
  necesita:
    - "Nada."
  problemas:
    - "Las apps del móvil no conectan → ponle dominio con HTTPS (así Vikunja sabe su dirección pública)."
