---
- name: ¿Está Listmonk?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/listmonk/docker-compose.yml
  register: listmonk_cf

- name: Parar y quitar Listmonk
  ansible.builtin.command: docker compose -p dn-listmonk down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/listmonk
  when: listmonk_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/listmonk {{ draupnode_secrets_dir | quote }}/listmonk_admin {{ draupnode_secrets_dir | quote }}/.listmonk_admin_pass {{ draupnode_secrets_dir | quote }}/.listmonk_db
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Listmonk {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/listmonk: si lo reinstalas, vuelve todo.' }}"
