---
- name: Carpeta de Listmonk
  ansible.builtin.set_fact:
    listmonk_dir: /srv/draupnode/apps/listmonk
    listmonk_url: "{{ ('https://' ~ listmonk_domain) if listmonk_domain else ('http://127.0.0.1:' ~ listmonk_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # La de PostgreSQL la deja la imagen en 0700: no se toca (si no, cambiaría en cada aplicación).
    mode: "{{ omit if item.endswith('/pgdata') else '0750' }}"
  loop:
    - "{{ listmonk_dir }}"
    - "{{ listmonk_dir }}/uploads"
    - "{{ listmonk_dir }}/pgdata"

- name: Contraseña «.listmonk_admin_pass» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    listmonk_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.listmonk_admin_pass', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: Contraseña «.listmonk_db» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    listmonk_db_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.listmonk_db', chars=['ascii_letters', 'digits'], length=32) }}"
  no_log: true
  when: not ansible_check_mode

- name: Usuario y contraseña, para verlos en la app
  ansible.builtin.copy:
    dest: "{{ draupnode_secrets_dir }}/listmonk_admin"
    mode: "0600"
    content: "Usuario: admin\nContraseña: {{ listmonk_admin_pass }}\n"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ listmonk_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Listmonk
  ansible.builtin.command: docker compose -p dn-listmonk up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ listmonk_dir }}"
  register: listmonk_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: listmonk_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in listmonk_up.stderr or 'Created' in listmonk_up.stderr or 'Recreated' in listmonk_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ listmonk_port }}/admin/login"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: listmonk_http
  until: listmonk_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-listmonk
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Listmonk {{ 'responde' if (listmonk_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-listmonk logs, en ' ~ listmonk_dir ~ ')' }} en {{ listmonk_url }}.
      Entra en /admin con «admin» (contraseña en «Contraseñas») y pon tu SMTP en Settings → SMTP.
