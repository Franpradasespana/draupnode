id: listmonk
name: "Listmonk (boletines y listas de correo)"
version: 1.0.0
category: 7 · Apps
description: "Envía boletines a tus suscriptores: listas, plantillas, campañas, estadísticas de aperturas y bajas. Manda los correos por el SMTP que le digas."
details: |
  Listmonk en Docker, con su propio PostgreSQL. Draupnode crea el usuario
  «admin» con la contraseña generada en el servidor (en «Contraseñas»).
  Para enviar necesita un servidor SMTP (el de tu proveedor de correo,
  Amazon SES, Stalwart…): ponlo en «Settings → SMTP».
  Con dominio, los formularios de alta y los enlaces de baja funcionan
  desde internet.
  Sus datos están en /srv/draupnode/apps/listmonk (entran en las copias del
  módulo Copias). Licencia: AGPL-3.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
  min_ram_mb: 300
firewall_ports_from: [listmonk_public_port]
proxy_site:
  domain: listmonk_domain
  port: listmonk_port
secrets:
  - file: listmonk_admin
    label: Usuario «admin» de Listmonk
uninstall_warning: "Para y quita los contenedores de Listmonk."
uninstall_data: "Borrar también sus datos (las listas, suscriptores, campañas y su base de datos). No se puede deshacer."
variables:
  - name: listmonk_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 9002
    min: 1024
    max: 65535
  - name: listmonk_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: listmonk_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: listmonk_update
    label: Actualizar Listmonk al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://listmonk.app
  - label: "Documentación"
    url: https://listmonk.app/docs/
  - label: "Código fuente"
    url: https://github.com/knadh/listmonk

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «Listmonk» y aplica."
    - "Pulsa «Abrir (túnel SSH)», entra en /admin con «admin» y crea una lista y una campaña."
  comprobar:
    - "Entras con «admin» y la contraseña de «Contraseñas»."
    - "Con un SMTP puesto en Settings → SMTP, «Enviar prueba» llega a tu correo."
  necesita:
    - "Para enviar de verdad, un servidor SMTP."
  problemas:
    - "No envía → revisa Settings → SMTP (y los registros SPF/DKIM de tu dominio para no ir a spam)."
