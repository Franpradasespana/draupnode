id: authelia
name: "Authelia (inicio de sesión único y doble factor)"
version: 1.0.0
category: 8 · Seguridad
description: "Una puerta delante de tus apps: antes de entrar en ellas hay que iniciar sesión (con doble factor si quieres). Protege apps que no tienen usuarios propios o que no deberían estar a la vista."
details: |
  Authelia en Docker, con su base SQLite y un usuario «admin» con la
  contraseña generada en el servidor (en «Contraseñas»).
  Necesita su propio dominio (por ejemplo auth.ejemplo.com) y que las apps
  que protege estén bajo el mismo dominio principal (ejemplo.com), porque
  la sesión va en una cookie de ese dominio. En «Dominios protegidos» pon
  los de las apps que quieras tapar: Draupnode configura Caddy para que
  pregunte a Authelia antes de dejar pasar (con nginx no se hace sola).
  Los mensajes que Authelia mandaría por correo (por ejemplo, el código
  para registrar el doble factor) quedan en config/notificaciones.txt.
  Sus datos están en /srv/draupnode/apps/authelia (entran en las copias del
  módulo Copias). Licencia: Apache-2.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
firewall_ports_from: [authelia_public_port]
proxy_site:
  domain: authelia_domain
  port: authelia_port
secrets:
  - file: authelia_admin
    label: Usuario «admin» de Authelia
uninstall_warning: "Para y quita los contenedores de Authelia."
uninstall_data: "Borrar también sus datos (sus usuarios, la base de datos y la configuración). No se puede deshacer."
variables:
  - name: authelia_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 9091
    min: 1024
    max: 65535
  - name: authelia_domain
    label: Dominio
    help: "Obligatorio: el dominio del portal de Authelia (auth.ejemplo.com). Necesita Caddy en el servidor."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: authelia_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: authelia_protect
    label: Dominios protegidos
    help: Uno por línea. Para entrar en ellos habrá que iniciar sesión en Authelia. Tienen que ser del mismo dominio principal que el de Authelia.
    type: list
    default: []
    pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$'
    pattern_help: Un dominio (app.ejemplo.com)
  - name: authelia_policy
    label: Cómo se entra
    help: «two_factor» = contraseña y además un código del móvil (lo recomendado). «one_factor» = solo contraseña.
    type: select
    options: [two_factor, one_factor]
    default: two_factor
  - name: authelia_update
    label: Actualizar Authelia al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://www.authelia.com
  - label: "Documentación"
    url: https://www.authelia.com/configuration/prologue/introduction/
  - label: "Código fuente"
    url: https://github.com/authelia/authelia

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "No del todo: necesita un dominio de verdad con HTTPS (Caddy) para iniciar sesión. En el servidor de pruebas solo se comprueba que arranca."
  pasos:
    - "Añade «Caddy» y «Authelia» con el dominio auth.tu-dominio y, en «Dominios protegidos», el de alguna app (por ejemplo kuma.tu-dominio de Uptime Kuma)."
    - "Aplica y abre https://kuma.tu-dominio."
  comprobar:
    - "Antes de ver la app te manda a https://auth.tu-dominio a iniciar sesión."
    - "Con «admin» y la contraseña de «Contraseñas» (y el código del doble factor) entras en la app."
  necesita:
    - "Un dominio con sus subdominios apuntando al servidor y Caddy."
  problemas:
    - "Te pide el código de registro del doble factor → está en /srv/draupnode/apps/authelia/config/notificaciones.txt (míralo en «Terminal»)."
    - "Bucle de redirecciones → la app y Authelia tienen que colgar del mismo dominio principal."
    - "Con nginx no protege nada → de momento la protección automática es solo con Caddy."
