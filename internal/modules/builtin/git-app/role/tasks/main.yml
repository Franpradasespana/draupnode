---
- name: Rutas
  ansible.builtin.set_fact:
    git_app_dir: "/srv/draupnode/apps/{{ git_app_name }}"
    git_app_key: "{{ draupnode_secrets_dir }}/.git_app_{{ git_app_name }}_key"
    git_app_ssh: "{{ git_app_repo is match('^[A-Za-z0-9._-]+@') }}"
    git_app_project: "dn-{{ git_app_name }}"
    # Otra app de Git en el mismo servidor (instancia): sus valores generados llevan su nombre.
    git_app_gen_prefix: "{{ 'git_app_env_' if (draupnode_instance | default('')) == '' else 'git_app_' ~ draupnode_instance ~ '_env_' }}"
    git_app_progress: "/var/lib/draupnode/progreso/{{ draupnode_project }}.log"

- name: Instalar git
  ansible.builtin.apt:
    name: git
    state: present
    lock_timeout: 600

- name: Deploy key (repositorio privado por SSH)
  ansible.builtin.shell: |
    [ -f {{ git_app_key | quote }} ] && exit 0
    ssh-keygen -q -t ed25519 -N '' -C "draupnode-{{ draupnode_project }}-{{ git_app_name }}" -f {{ git_app_key | quote }}
    cp {{ (git_app_key ~ '.pub') | quote }} {{ (draupnode_secrets_dir ~ '/git_app_' ~ git_app_name ~ '_deploy_key.pub') | quote }}
    echo creada
  register: git_app_keygen
  changed_when: "'creada' in git_app_keygen.stdout"
  when: git_app_ssh | bool and not ansible_check_mode

- name: Traer el código (clonar o actualizar)
  ansible.builtin.shell: |
    set -e
    export GIT_SSH_COMMAND="ssh -i {{ git_app_key }} -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ draupnode_secrets_dir }}/.git_known_hosts"
    # Repositorio privado por https: el token va en una cabecera solo para esta orden
    # (no se guarda en .git/config ni sale en la orden: llega por el entorno).
    if [ -n "${GIT_APP_TOKEN:-}" ]; then
      auth=$(printf 'x-access-token:%s' "$GIT_APP_TOKEN" | base64 -w0)
      export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
    fi
    d={{ git_app_dir | quote }}
    if [ ! -d "$d/.git" ]; then
      mkdir -p "$(dirname "$d")"; rm -rf "$d.tmp"
      # Sin terminal: si pide contraseña (repo privado sin la deploy key), falla en vez de esperar.
      export GIT_TERMINAL_PROMPT=0
      timeout 600 git clone -q --branch {{ git_app_branch | quote }} {{ git_app_repo | quote }} "$d.tmp" || { rm -rf "$d.tmp"; exit 1; }
      mv "$d.tmp" "$d"
      echo clonado
    elif [ {{ git_app_update | bool | string | lower | quote }} = true ]; then
      cd "$d"
      git remote set-url origin {{ git_app_repo | quote }}
      antes=$(git rev-parse HEAD)
      GIT_TERMINAL_PROMPT=0 timeout 600 git fetch -q origin {{ git_app_branch | quote }}
      git reset -q --hard FETCH_HEAD
      [ "$antes" != "$(git rev-parse HEAD)" ] && echo actualizado || true
    fi
    git -C "$d" log -1 --format='%h %s'
  environment:
    GIT_APP_TOKEN: "{{ (git_app_token | default('') | trim) if not (git_app_ssh | bool) else '' }}"
  register: git_app_git
  changed_when: "'clonado' in git_app_git.stdout or 'actualizado' in git_app_git.stdout"
  failed_when: false
  when: not ansible_check_mode

- name: No se pudo traer el código
  ansible.builtin.fail:
    msg: >-
      No se pudo descargar {{ git_app_repo }} ({{ git_app_git.stderr | default('') | trim | truncate(300) }}).
      {% if git_app_ssh | bool %}Si es privado, añade esta deploy key (solo lectura) al repositorio y vuelve a aplicar:
      {{ lookup('ansible.builtin.file', git_app_key ~ '.pub', errors='ignore') }}
      {%- elif (git_app_token | default('') | trim) %}El token no sirve para este repositorio: comprueba que no ha caducado y que tiene permiso de lectura («Contents: Read-only» en GitHub) sobre él.
      {%- else %}Si el repositorio es privado, pon un «Token de acceso» de solo lectura en las opciones del módulo (o usa la dirección git@… con deploy key) y vuelve a aplicar.{% endif %}
  when: not ansible_check_mode and git_app_git.rc != 0

- name: Dueño de la carpeta de la app
  ansible.builtin.command: chown -R {{ git_app_owner | quote }} {{ git_app_dir | quote }}
  changed_when: false
  when: not ansible_check_mode and git_app_owner | default('') != ''

- name: El compose existe
  ansible.builtin.stat:
    path: "{{ git_app_dir }}/{{ git_app_compose }}"
  register: git_app_cf
  when: not ansible_check_mode

- name: Falta el compose
  ansible.builtin.fail:
    msg: "El repositorio no tiene {{ git_app_compose }} (en la rama {{ git_app_branch }}). Créalo con Docker Creator y súbelo."
  when: not ansible_check_mode and not git_app_cf.stat.exists

- name: Valores generados (una vez)
  ansible.builtin.set_fact:
    git_app_gen: "{{ git_app_gen | default({}) | combine({item: lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/' ~ git_app_gen_prefix ~ item, chars=['ascii_letters', 'digits'], length=40)}) }}"
  loop: "{{ git_app_env_generate }}"
  no_log: true
  when: not ansible_check_mode

- name: Contenido del .env
  # En la simulación, los generados aún no existen: se cuentan como «con valor».
  ansible.builtin.set_fact:
    git_app_env_text: |
      # Generado por Draupnode (módulo git-app). Se reescribe al aplicar.
      {% for l in git_app_env %}
      {{ l }}
      {% endfor %}
      {% for k, v in (git_app_gen | default(dict(git_app_env_generate | zip(git_app_env_generate | map('regex_replace', '.*', 'generado'))))).items() %}
      {{ k }}={{ v }}
      {% endfor %}
      {% for l in (git_app_env_secret | default('')).split(';') if '=' in l %}
      {{ l | trim }}
      {% endfor %}
  no_log: true

- name: .env
  ansible.builtin.copy:
    dest: "{{ git_app_dir }}/.env"
    mode: "0600"
    content: "{{ git_app_env_text }}"
  register: git_app_envf
  no_log: true
  when: not ansible_check_mode

# ---- Simulación: sin tocar la app, qué cambiaría y qué fallaría
- name: ¿Está ya la app en el servidor?
  ansible.builtin.stat:
    path: "{{ git_app_dir }}/.git"
  register: git_app_cloned
  check_mode: false

- name: Simulación · primera vez
  ansible.builtin.debug:
    msg: "{{ git_app_name }}: se bajará {{ git_app_repo }} y se construirá por primera vez (sin bajarla no se puede revisar más)."
  changed_when: true
  when: ansible_check_mode and not git_app_cloned.stat.exists

- name: Simulación · ¿hay cambios en el repositorio?
  ansible.builtin.shell: |
    export GIT_TERMINAL_PROMPT=0
    export GIT_SSH_COMMAND="ssh -i {{ git_app_key }} -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ draupnode_secrets_dir }}/.git_known_hosts"
    if [ -n "${GIT_APP_TOKEN:-}" ]; then
      auth=$(printf 'x-access-token:%s' "$GIT_APP_TOKEN" | base64 -w0)
      export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
    fi
    cd {{ git_app_dir | quote }}
    remoto=$(timeout 60 git ls-remote {{ git_app_repo | quote }} {{ ('refs/heads/' ~ git_app_branch) | quote }} | cut -f1)
    echo "$(git rev-parse HEAD) ${remoto:-?}"
  environment:
    GIT_APP_TOKEN: "{{ (git_app_token | default('') | trim) if not (git_app_ssh | bool) else '' }}"
  register: git_app_remote
  check_mode: false
  changed_when: (git_app_remote.stdout.split() | length) == 2 and git_app_remote.stdout.split()[0] != git_app_remote.stdout.split()[1] and git_app_update | bool
  failed_when: false
  when: ansible_check_mode and git_app_cloned.stat.exists

- name: Simulación · cambios nuevos
  ansible.builtin.debug:
    msg: "{{ git_app_name }}: hay cambios nuevos en el repositorio ({{ git_app_remote.stdout.split()[0][:7] }} → {{ git_app_remote.stdout.split()[1][:7] }}): al aplicar se bajarán y se reconstruirá."
  changed_when: true
  when: ansible_check_mode and git_app_remote is changed

- name: .env para revisar (simulación)
  ansible.builtin.copy:
    dest: "/tmp/draupnode-env-{{ git_app_project }}"
    mode: "0600"
    content: "{{ git_app_env_text }}"
  check_mode: false
  changed_when: false
  no_log: true
  when: ansible_check_mode and git_app_cloned.stat.exists

# ---- Revisar el compose (simulación y aplicar): variables, puertos, código montado
- name: Revisar el compose
  ansible.builtin.command:
    argv: [python3, "{{ role_path }}/files/revisar.py", compose, "{{ git_app_dir }}", "{{ git_app_project }}", "{{ git_app_compose }}", "{{ ('/tmp/draupnode-env-' ~ git_app_project) if ansible_check_mode else (git_app_dir ~ '/.env') }}"]
  register: git_app_review
  check_mode: false
  changed_when: false
  when: git_app_cloned.stat.exists or not ansible_check_mode

- name: Quitar el .env de la simulación
  ansible.builtin.file:
    path: "/tmp/draupnode-env-{{ git_app_project }}"
    state: absent
  check_mode: false
  changed_when: false
  when: ansible_check_mode

- name: Lo que se ha visto en el compose
  ansible.builtin.set_fact:
    git_app_rev: "{{ git_app_review.stdout | from_json }}"
  when: git_app_review.stdout is defined and git_app_review.stdout | length > 0

- name: Faltan variables
  ansible.builtin.fail:
    msg: >-
      El docker-compose usa variables que no tienen valor: {{ git_app_rev.unset | join(', ') }}.
      Ponlas en las opciones del módulo: en «Variables (.env)» como CLAVE=valor, en «Generar en el servidor» si deben
      ser al azar, o en «Variables secretas». Si alguna debe quedar vacía a propósito, escríbela como «CLAVE=».
      («Leer el repositorio», en las opciones, las encuentra solas.)
  when: git_app_rev is defined and git_app_rev.unset | length > 0

- name: El compose no se puede leer
  ansible.builtin.fail:
    msg: "docker compose no puede leer {{ git_app_compose }}: {{ git_app_rev.error }}"
  when: git_app_rev is defined and git_app_rev.error != '' and git_app_rev.services | length == 0

- name: Aviso · puertos abiertos a internet
  ansible.builtin.debug:
    msg: >-
      {{ git_app_name }}: {{ git_app_rev.public | join(', ') }} {{ 'se publica' if git_app_rev.public | length == 1 else 'se publican' }}
      a todo internet, y Docker se salta el cortafuegos. Si la app va detrás de Caddy/nginx o la abres por túnel SSH,
      publícalo solo en 127.0.0.1 (p. ej. «127.0.0.1:8000:8000» o la variable del .env que lo controle).
  when: git_app_rev is defined and git_app_rev.public | length > 0

- name: Aviso · código montado encima de la app
  ansible.builtin.debug:
    msg: >-
      {{ git_app_name }}: {{ git_app_rev.srcmount | join(', ') }} monta la carpeta del código («.») dentro del contenedor.
      Eso es para desarrollo: en un servidor tapa lo que se construyó en la imagen. Si el compose lo controla con
      una variable del .env, quítala o cámbiala.
  when: git_app_rev is defined and git_app_rev.srcmount | length > 0

- name: Simulación · contenedores que no están en marcha
  ansible.builtin.command:
    argv: [python3, "{{ role_path }}/files/revisar.py", estado, "{{ git_app_dir }}", "{{ git_app_project }}", "{{ git_app_compose }}"]
  register: git_app_state
  check_mode: false
  changed_when: (git_app_state.stdout | from_json).stopped | length > 0
  when: ansible_check_mode and git_app_cloned.stat.exists

- name: Simulación · parados
  ansible.builtin.debug:
    msg: "{{ git_app_name }}: ahora no están en marcha: {{ (git_app_state.stdout | from_json).stopped | join(', ') }}. Al aplicar se volverán a arrancar."
  changed_when: true
  when: ansible_check_mode and git_app_state is changed

- name: Construir la app (se ve en directo)
  # La salida va a un fichero que Draupnode enseña mientras tanto. Se para si pasa
  # git_app_build_minutes en total o 10 minutos sin escribir nada (atascada).
  ansible.builtin.shell: |
    set -u
    log={{ git_app_progress | quote }}
    mkdir -p "$(dirname "$log")"; : > "$log"; chmod 600 "$log"
    docker compose -p {{ git_app_project }} -f {{ git_app_compose | quote }} build --progress=plain >>"$log" 2>&1 &
    pid=$!
    start=$(date +%s); last=$start; size=0
    while kill -0 "$pid" 2>/dev/null; do
      sleep 5
      now=$(date +%s); s=$(stat -c %s "$log" 2>/dev/null || echo 0)
      [ "$s" != "$size" ] && { size=$s; last=$now; }
      if [ $((now - start)) -gt $(( {{ git_app_build_minutes | int }} * 60 )) ]; then why=tiempo; break; fi
      if [ $((now - last)) -gt 600 ]; then why=atascada; break; fi
    done
    if [ -n "${why:-}" ]; then
      kill "$pid" 2>/dev/null; sleep 3; kill -9 "$pid" 2>/dev/null
      echo "@@PARADA $why"
      grep -E '^#[0-9]+ \[' "$log" | tail -n 1
      exit 3
    fi
    wait "$pid"; rc=$?
    [ "$rc" = 0 ] || tail -n 40 "$log"
    exit $rc
  args:
    chdir: "{{ git_app_dir }}"
  register: git_app_build
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: La construcción no ha terminado bien
  ansible.builtin.fail:
    msg: >-
      {% if '@@PARADA tiempo' in git_app_build.stdout %}La construcción ha tardado más de {{ git_app_build_minutes }} minutos y se ha parado
      (último paso: {{ git_app_build.stdout_lines[-1] | default('') }}). Si tu app tarda tanto de verdad, sube «Tiempo máximo para construir».
      {%- elif '@@PARADA atascada' in git_app_build.stdout %}La construcción llevaba 10 minutos sin avanzar y se ha parado. Se quedó en:
      {{ git_app_build.stdout_lines[-1] | default('') }}. Suele ser una orden que espera algo que no llega (un modo «desarrollo»/«watch»,
      una pregunta…): revisa las variables (NODE_ENV=production, DEBUG=false…).
      {%- else %}Falló la construcción de la imagen (docker compose build). Últimas líneas:
      {{ git_app_build.stdout | default('') }}{% endif %}
  when: not ansible_check_mode and git_app_build.rc != 0

- name: Permisos de las carpetas de la app
  # Si la imagen no corre como root y monta carpetas de la app, se las da a su
  # usuario (lo que haría falta poner a mano en «Dueño de la carpeta de la app»).
  ansible.builtin.command:
    argv: [python3, "{{ role_path }}/files/revisar.py", permisos, "{{ git_app_dir }}", "{{ git_app_project }}", "{{ git_app_compose }}"]
  register: git_app_perms
  changed_when: (git_app_perms.stdout | from_json).notes | length > 0
  when: not ansible_check_mode and git_app_owner | default('') == ''

- name: Permisos ajustados
  ansible.builtin.debug:
    msg: "{{ git_app_name }}: carpetas dadas al usuario con el que corre la app: {{ (git_app_perms.stdout | from_json).notes | join('; ') }}."
  when: git_app_perms is changed

- name: Arrancar
  ansible.builtin.command: docker compose -p {{ git_app_project }} -f {{ git_app_compose }} up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ git_app_dir }}"
  register: git_app_up
  changed_when: "'Started' in git_app_up.stderr or 'Recreated' in git_app_up.stderr or 'Created' in git_app_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que arranquen los contenedores
  # Hasta 2 min: todos en marcha y ninguno «arrancando» (healthcheck) ni reiniciándose.
  ansible.builtin.shell: |
    for i in $(seq 1 40); do
      st=$(docker compose -p {{ git_app_project }} -f {{ git_app_compose | quote }} ps -a --format '{{ '{{' }}.Service{{ '}}' }}|{{ '{{' }}.State{{ '}}' }}|{{ '{{' }}.Health{{ '}}' }}|{{ '{{' }}.ExitCode{{ '}}' }}')
      echo "$st" | grep -qE '\|(restarting|created)\||\|starting\|' || { echo "$st"; exit 0; }
      sleep 3
    done
    echo "$st"
  args:
    chdir: "{{ git_app_dir }}"
  register: git_app_ps
  changed_when: false
  when: not ansible_check_mode

- name: Contenedores que no han arrancado bien
  ansible.builtin.set_fact:
    git_app_bad: "{{ git_app_ps.stdout_lines | select('search', '\\|(exited|dead|restarting|created)\\||\\|unhealthy\\|') | list }}"
  when: not ansible_check_mode

- name: Registro de los que fallan
  ansible.builtin.shell: |
    docker compose -p {{ git_app_project }} -f {{ git_app_compose | quote }} logs --no-color --tail 25 {{ git_app_bad | map('split', '|') | map('first') | map('quote') | join(' ') }} 2>&1 | tail -n 60
  args:
    chdir: "{{ git_app_dir }}"
  register: git_app_badlogs
  changed_when: false
  failed_when: false
  when: not ansible_check_mode and git_app_bad | length > 0

- name: La app no ha arrancado
  ansible.builtin.fail:
    msg: |
      No han arrancado bien: {% for l in git_app_bad %}{% set f = l.split('|') %}{{ f[0] }} ({{ f[1] }}{% if f[2] %}, {{ f[2] }}{% endif %}{% if f[1] == 'exited' %}, código {{ f[3] }}{% endif %}){{ ', ' if not loop.last }}{% endfor %}.
      Últimas líneas de su registro:
      {{ git_app_badlogs.stdout | default('') }}
  when: not ansible_check_mode and git_app_bad | length > 0

- name: Orden después de arrancar
  ansible.builtin.command:
    argv: [docker, compose, -p, "{{ git_app_project }}", -f, "{{ git_app_compose }}", exec, -T, "{{ git_app_post_service }}", sh, -c, "{{ git_app_post_command }}"]
  args:
    chdir: "{{ git_app_dir }}"
  register: git_app_post
  changed_when: true
  failed_when: false
  when: not ansible_check_mode and (git_app_post_command | default('') | trim) != ''

- name: La orden después de arrancar falló
  ansible.builtin.fail:
    msg: |
      «{{ git_app_post_command }}» en el servicio {{ git_app_post_service }} terminó con error (código {{ git_app_post.rc }}). Últimas líneas:
      {{ (((git_app_post.stdout | default('')) ~ '\n' ~ (git_app_post.stderr | default(''))) | trim)[-3000:] }}
  when: not ansible_check_mode and git_app_post.rc is defined and git_app_post.rc != 0

- name: Comprobar que responde
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ git_app_port }}/"
    status_code: [200, 201, 204, 301, 302, 303, 307, 308, 401, 403, 404]
    follow_redirects: none
  register: git_app_http
  until: git_app_http.status in [200, 201, 204, 301, 302, 303, 307, 308, 401, 403, 404]
  retries: 30
  delay: 3
  failed_when: false
  when: not ansible_check_mode and git_app_port | int > 0

- name: La app no responde
  ansible.builtin.fail:
    msg: >-
      Los contenedores están en marcha, pero la app no contesta en 127.0.0.1:{{ git_app_port }} tras 90 s.
      Comprueba que el compose publica ese puerto («Puerto de la app» en las opciones) o mira su registro en la ficha
      del servidor → Contenedores. 0 en «Puerto de la app» = no comprobar.
  when: not ansible_check_mode and git_app_port | int > 0 and git_app_http.status | default(-1) not in [200, 201, 204, 301, 302, 303, 307, 308, 401, 403, 404]

- name: Nota
  ansible.builtin.debug:
    msg: >-
      {{ git_app_name }}: {{ git_app_git.stdout_lines[-1] | default('') if git_app_git.stdout_lines is defined else '' }}.
      {%- if git_app_port | int > 0 and git_app_http.status is defined %} {{ 'Responde' if git_app_http.status in [200, 201, 204, 301, 302, 303, 307, 308, 401, 403, 404] else 'NO responde todavía' }} en 127.0.0.1:{{ git_app_port }}{% if git_app_http.status not in [200, 201, 204, 301, 302, 303, 307, 308, 401, 403, 404] %} (míralo con «docker compose -p {{ git_app_project }} logs» en {{ git_app_dir }}){% endif %}.{% endif %}
      {%- if git_app_domain %} Dominio: https://{{ git_app_domain }}.{% endif %}
