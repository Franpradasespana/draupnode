id: git-app
name: App desde Git (Docker Compose)
version: 1.0.0
category: 3 · Plataformas
description: Despliega tu app desde su repositorio de Git con su docker-compose.yml (por ejemplo, el que genera Docker Creator). Al aplicar, la actualiza.
details: |
  Clona el repositorio en /srv/draupnode/apps/<nombre> y la arranca con
  «docker compose up -d --build». Cada vez que aplicas, trae lo último de la
  rama y la vuelve a construir (solo se reinicia lo que cambia).
  Repositorio privado, dos formas:
  - Con la dirección https:// y un «Token de acceso» de solo lectura (GitHub:
    Fine-grained token con «Contents: Read-only» solo para ese repositorio).
    Se guarda cifrado en tu bóveda; en el servidor no queda escrito.
  - Con la dirección SSH (git@github.com:usuario/repo.git): Draupnode crea una
    «deploy key» en el servidor; la ves en «Contraseñas» y la añades en tu
    GitHub/GitLab/Forgejo (Settings → Deploy keys, solo lectura).
  Variables (.env): las normales, una por línea «CLAVE=valor»; las que deben
  ser secretas y al azar (SECRET_KEY, DB_PASSWORD…), en «Generar en el
  servidor»: se crean una vez y no cambian.
  Dominio: con Caddy o nginx en el servidor, se añade solo a sus sitios.
  Una app por plantilla: para otra, asocia otra plantilla al mismo servidor.
depends: [docker]
# Varias apps en un servidor: «Añadir otra app» crea otra copia (git-app@nombre).
repeatable: true
requires:
  os: [ubuntu, debian]
firewall_ports_from: [git_app_public_port]
proxy_site:
  domain: git_app_domain
  port: git_app_port
secrets:
  - file: git_app_*.pub
    label: Deploy key (añádela al repositorio, solo lectura)
  - file: git_app_env_*
    label: Valor generado para el .env
  - file: git_app_*_env_*
    label: Valor generado para el .env (otra app)
uninstall_warning: Para y quita los contenedores de la app.
uninstall_data: Borrar también su carpeta, sus volúmenes de Docker (datos de la app y su base de datos) y sus valores generados.
variables:
  - name: git_app_repo
    label: Repositorio
    help: "https://github.com/usuario/repo.git (público, o privado con el token de abajo) o git@github.com:usuario/repo.git (privado, con deploy key)."
    type: string
    required: true
    pattern: '^(https://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+|[A-Za-z0-9._-]+@[A-Za-z0-9.-]+:[A-Za-z0-9._/~-]+)$'
    pattern_help: Dirección https:// o git@servidor:usuario/repo.git
  - name: git_app_token
    label: Token de acceso (solo si el repositorio es privado)
    help: "Para una dirección https:// de un repositorio privado. En GitHub: Settings → Developer settings → Personal access tokens → Fine-grained tokens, solo este repositorio y permiso «Contents: Read-only» (en GitLab/Forgejo, un token con lectura del repositorio). Se guarda cifrado en tu bóveda y no se queda escrito en el servidor. Si es público, déjalo vacío. Sin token: usa la dirección git@… y la deploy key."
    type: secret
  - name: git_app_branch
    label: Rama
    type: string
    default: main
    pattern: '^[A-Za-z0-9._/-]+$'
    pattern_help: Nombre de rama
  - name: git_app_name
    label: Nombre de la app
    help: Para su carpeta y sus contenedores.
    type: string
    default: app
    pattern: '^[a-z][a-z0-9-]{1,30}$'
    pattern_help: Minúsculas, números y guiones
  - name: git_app_compose
    label: Fichero compose
    help: Dentro del repositorio.
    type: string
    default: docker-compose.yml
    pattern: '^[A-Za-z0-9._/-]+\.ya?ml$'
    pattern_help: Ruta a un .yml
  - name: git_app_env
    label: Variables (.env)
    help: "Las de tu app que no son secretas, una por fila (nombre y valor). Las resaltadas hay que completarlas o revisarlas antes de aplicar. Las contraseñas no van aquí: en «Generar en el servidor» o en «Variables secretas»."
    type: list
    default: []
    pattern: '^[A-Za-z_][A-Za-z0-9_]*=.*$'
    pattern_help: CLAVE=valor
  - name: git_app_env_generate
    label: Generar en el servidor (secretos al azar)
    help: Nombres de variables, uno por línea (SECRET_KEY, DB_PASSWORD…). Se crean una vez y se guardan.
    type: list
    default: []
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    pattern_help: Nombre de variable
  - name: git_app_env_secret
    label: Variables secretas con valor tuyo
    help: "Tokens o claves que ya tienes: «CLAVE=valor; OTRA=valor». Se guardan cifradas en tu bóveda."
    type: secret
  - name: git_app_post_command
    label: Orden después de arrancar
    help: "Se ejecuta cada vez que aplicas, dentro del servicio de abajo, con la app ya en marcha. Para preparar la base de datos: «./manage.py migrate» (Django), «php artisan migrate --force» (Laravel), «npx prisma migrate deploy»… Vacío = nada."
    type: string
    default: ""
  - name: git_app_post_service
    label: Servicio donde se ejecuta la orden
    help: El nombre del servicio en el docker-compose (p. ej. web, app).
    type: string
    default: web
    pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
    pattern_help: Nombre de un servicio del compose
  - name: git_app_owner
    label: Dueño de la carpeta de la app
    help: "Si la app corre en el contenedor con un usuario que no es root y necesita escribir en su carpeta (error «Permission denied»), pon aquí su UID:GID, p. ej. 1000:1000. Vacío = la deja como está (de root)."
    type: string
    default: ""
    pattern: '^([0-9]{1,6}(:[0-9]{1,6})?)?$'
    pattern_help: UID o UID:GID (números), o vacío
  - name: git_app_build_minutes
    label: Tiempo máximo para construir (minutos)
    help: Si la construcción tarda más, se para. También se para si pasa 10 minutos sin avanzar (sin escribir nada).
    type: int
    default: 30
    min: 5
    max: 240
  - name: git_app_port
    label: Puerto de la app en el servidor
    help: El que publica tu compose (para el dominio y la comprobación). 0 = no comprobar.
    type: int
    default: 8000
    min: 0
    max: 65535
  - name: git_app_domain
    label: Dominio
    help: Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio.
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (tienda.ejemplo.com) o vacío
  - name: git_app_public_port
    label: Abrir un puerto a internet
    help: 0 = no (lo normal con dominio). Si no, se abre en el Cortafuegos.
    type: int
    default: 0
    min: 0
    max: 65535
  - name: git_app_update
    label: Traer lo último de Git al aplicar
    type: bool
    default: true
links:
  - label: "Git"
    url: https://git-scm.com
  - label: "Docker Compose"
    url: https://docs.docker.com/compose/
  - label: "Código de Compose"
    url: https://github.com/docker/compose
