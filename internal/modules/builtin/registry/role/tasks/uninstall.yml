---
- name: ¿Está Registro de Docker?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/registry/docker-compose.yml
  register: registry_cf

- name: Parar y quitar Registro de Docker
  ansible.builtin.command: docker compose -p dn-registry down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/registry
  when: registry_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/registry {{ draupnode_secrets_dir | quote }}/registry_usuario {{ draupnode_secrets_dir | quote }}/.registry_pass
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Registro de Docker {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/registry: si lo reinstalas, vuelve todo.' }}"
