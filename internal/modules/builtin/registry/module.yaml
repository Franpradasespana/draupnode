id: registry
name: "Registro de imágenes Docker"
version: 1.0.0
category: 2 · Contenedores
description: "Tu propio Docker Hub privado: guarda tus imágenes en el servidor y descárgalas desde tus equipos o tu CI con usuario y contraseña."
details: |
  El registro oficial de Docker (CNCF Distribution 3) con usuario y
  contraseña (generada en el servidor, en «Contraseñas»).
  Para usarlo desde otros equipos ponle dominio (Caddy o nginx) y haz
  «docker login tu-dominio»: Docker solo habla con registros con HTTPS
  (salvo 127.0.0.1). Las imágenes se guardan en
  /srv/draupnode/apps/registry/data (pueden ocupar mucho).
  Sus datos están en /srv/draupnode/apps/registry (entran en las copias del
  módulo Copias). Licencia: Apache-2.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
firewall_ports_from: [registry_public_port]
proxy_site:
  domain: registry_domain
  port: registry_port
secrets:
  - file: registry_usuario
    label: Usuario del registro de imágenes
uninstall_warning: "Para y quita los contenedores de Registro de Docker."
uninstall_data: "Borrar también sus datos (todas las imágenes subidas). No se puede deshacer."
variables:
  - name: registry_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 5000
    min: 1024
    max: 65535
  - name: registry_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: registry_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: registry_user
    label: Usuario
    help: Con este usuario y la contraseña generada se hace «docker login».
    type: string
    default: draupnode
    pattern: '^[a-z][a-z0-9_-]{2,30}$'
    pattern_help: Minúsculas, números, - y _
  - name: registry_update
    label: Actualizar el registro al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Documentación"
    url: https://distribution.github.io/distribution/
  - label: "Código fuente"
    url: https://github.com/distribution/distribution

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «Registro de imágenes Docker» y aplica."
    - "En «Terminal»: «sudo docker login 127.0.0.1:5000 -u draupnode» (contraseña en «Contraseñas»), «sudo docker pull busybox», «sudo docker tag busybox 127.0.0.1:5000/prueba/busybox:1» y «sudo docker push 127.0.0.1:5000/prueba/busybox:1»."
  comprobar:
    - "«docker login» dice «Login Succeeded» y el push termina."
    - "«curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/v2/_catalog» sin usuario devuelve 401."
  necesita:
    - "Nada para probarlo en el servidor. Para usarlo desde otros equipos, un dominio con Caddy o nginx (Docker exige HTTPS)."
  problemas:
    - "«http: server gave HTTP response to HTTPS client» desde otro equipo → ponle dominio (Caddy/nginx) y usa «docker login tu-dominio»."
    - "Al subir imágenes grandes por nginx falla con «413» → sube el tamaño máximo de petición en nginx."
