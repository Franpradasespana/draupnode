---
- name: ¿Está su docker-compose.yml?
  ansible.builtin.stat:
    path: "{{ mariadb_dir }}/docker-compose.yml"
  register: mariadb_compose

- name: Parar y quitar MariaDB
  ansible.builtin.command: docker compose down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: "{{ mariadb_dir }}"
  when: mariadb_compose.stat.exists and not ansible_check_mode

- name: Borrar su carpeta y las contraseñas
  ansible.builtin.shell: |
    rm -rf {{ mariadb_dir | quote }}
    rm -f {{ draupnode_secrets_dir | quote }}/mariadb_*
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      MariaDB «{{ mariadb_container }}» {{ 'se quitará' if ansible_check_mode else 'quitado' }}.
      {{ 'También sus datos y contraseñas.' if draupnode_uninstall_purge | bool
         else 'Los datos siguen en su volumen Docker y las contraseñas en ' ~ draupnode_secrets_dir ~ ': si lo reinstalas, vuelve todo.' }}
