---
- name: Carpeta de Portainer
  ansible.builtin.set_fact:
    portainer_dir: /srv/draupnode/apps/portainer
    portainer_url: "{{ ('https://' ~ portainer_domain) if portainer_domain else ('http://127.0.0.1:' ~ portainer_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ portainer_dir }}"
    - "{{ portainer_dir }}/data"

- name: Contraseña «.portainer_admin_pass» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    portainer_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.portainer_admin_pass', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: Contraseña inicial de «admin» (Portainer solo la lee la primera vez)
  ansible.builtin.copy:
    dest: /srv/draupnode/apps/portainer/admin_pass
    content: "{{ portainer_admin_pass }}"
    mode: "0600"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Portainer
  ansible.builtin.command: docker compose -p dn-portainer up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ portainer_dir }}"
  register: portainer_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: portainer_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in portainer_up.stderr or 'Created' in portainer_up.stderr or 'Recreated' in portainer_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port }}/api/system/status"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: portainer_http
  until: portainer_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 40
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-portainer
  when: not ansible_check_mode

- name: Usuario y contraseña, para verlos en la app
  ansible.builtin.copy:
    dest: "{{ draupnode_secrets_dir }}/portainer_admin"
    mode: "0600"
    content: "Usuario: admin\nContraseña: {{ portainer_admin_pass }}\n"
  no_log: true
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Portainer {{ 'responde' if (portainer_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-portainer logs, en ' ~ portainer_dir ~ ')' }} en {{ portainer_url }}.
      Entra con «admin» (contraseña en «Contraseñas»). Maneja todo Docker: no lo publiques sin necesidad.
