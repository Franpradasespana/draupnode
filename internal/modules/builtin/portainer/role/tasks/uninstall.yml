---
- name: ¿Está Portainer?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/portainer/docker-compose.yml
  register: portainer_cf

- name: Parar y quitar Portainer
  ansible.builtin.command: docker compose -p dn-portainer down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/portainer
  when: portainer_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/portainer {{ draupnode_secrets_dir | quote }}/portainer_admin
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Portainer {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/portainer: si lo reinstalas, vuelve todo.' }}"
