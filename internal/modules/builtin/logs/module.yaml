id: logs
name: Registros (Loki)
version: 1.0.0
category: 6 · Monitorización
description: Guarda y busca en Grafana los registros de todos los contenedores y del sistema (SSH, sudo, servicios). Loki + Grafana Alloy.
details: |
  Loki guarda los registros y Grafana Alloy los recoge: la salida de cada
  contenedor Docker y el diario del sistema (journald). Se buscan en Grafana,
  en el panel «Registros de los contenedores». Todo de código abierto.
  Necesita la Monitorización (usa su Grafana). Ocupa unos 300-500 MB de RAM;
  por eso va aparte.
depends: [monitoring]
requires:
  os: [ubuntu, debian]
  min_ram_mb: 2000
  min_disk_gb: 5
uninstall_warning: Para y quita Loki y Alloy, y el panel de registros de Grafana.
uninstall_data: Borrar también los registros guardados.
variables:
  - name: logs_retention_days
    label: Días de registros que se guardan
    type: int
    default: 14
    min: 1
    max: 180
  - name: logs_journal
    label: Registros del sistema (journald)
    help: SSH, sudo, servicios, copias de seguridad… además de los contenedores.
    type: bool
    default: true
links:
  - label: "Loki"
    url: https://grafana.com/oss/loki/
  - label: "Código de Loki"
    url: https://github.com/grafana/loki
  - label: "Grafana Alloy"
    url: https://github.com/grafana/alloy

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí (necesita Monitorización y 2 GB de RAM)."
  pasos:
    - "Con Monitorización instalada, añade «Registros (Loki)» y aplica."
    - "En Grafana, abre el panel «Registros» o Explore → Loki."
    - "En «Terminal», haz algo que deje rastro (por ejemplo «sudo true» o reiniciar un contenedor)."
  comprobar:
    - "Salen los registros de los contenedores y del sistema (SSH, sudo, servicios), y lo que hiciste aparece al momento."
