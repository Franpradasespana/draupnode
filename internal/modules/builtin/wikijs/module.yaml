id: wikijs
name: "Wiki.js (wiki y documentación)"
version: 1.0.0
category: 7 · Apps
description: "Una wiki bonita y rápida para la documentación de tu equipo o tus notas: editor visual o Markdown, búsqueda, permisos e historial."
details: |
  Wiki.js 2 en Docker, con su propio PostgreSQL. La primera vez,
  entra y rellena el asistente: crea el administrador y pon la dirección
  del sitio (https://tu-dominio o la que te dé «Abrir»).
  Sus datos están en /srv/draupnode/apps/wikijs (entran en las copias del
  módulo Copias). Licencia: AGPL-3.0.
depends: [docker]
requires:
  os: [ubuntu, debian]
  min_ram_mb: 500
firewall_ports_from: [wikijs_public_port]
proxy_site:
  domain: wikijs_domain
  port: wikijs_port
uninstall_warning: "Para y quita los contenedores de Wiki.js."
uninstall_data: "Borrar también sus datos (todas las páginas, usuarios y su base de datos). No se puede deshacer."
variables:
  - name: wikijs_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 3003
    min: 1024
    max: 65535
  - name: wikijs_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: wikijs_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: wikijs_update
    label: Actualizar Wiki.js al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://js.wiki
  - label: "Código fuente"
    url: https://github.com/requarks/wiki

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «Wiki.js» y aplica."
    - "Pulsa «Abrir (túnel SSH)» y sigue el asistente: crea el administrador y pon la dirección del sitio."
  comprobar:
    - "Tras el asistente puedes crear una página y buscarla."
  necesita:
    - "Nada: la base de datos la crea Draupnode. El administrador se crea en el asistente."
  problemas:
    - "Los enlaces apuntan a otra dirección → cambia «Site URL» en Administración → General a tu dominio."
