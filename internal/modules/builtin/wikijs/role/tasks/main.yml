---
- name: Carpeta de Wiki.js
  ansible.builtin.set_fact:
    wikijs_dir: /srv/draupnode/apps/wikijs
    wikijs_url: "{{ ('https://' ~ wikijs_domain) if wikijs_domain else ('http://127.0.0.1:' ~ wikijs_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # La de PostgreSQL la deja la imagen en 0700: no se toca (si no, cambiaría en cada aplicación).
    mode: "{{ omit if item.endswith('/pgdata') else '0750' }}"
  loop:
    - "{{ wikijs_dir }}"
    - "{{ wikijs_dir }}/pgdata"

- name: Contraseña «.wikijs_db» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    wikijs_db_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.wikijs_db', chars=['ascii_letters', 'digits'], length=32) }}"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wikijs_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Wiki.js
  ansible.builtin.command: docker compose -p dn-wikijs up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ wikijs_dir }}"
  register: wikijs_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: wikijs_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in wikijs_up.stderr or 'Created' in wikijs_up.stderr or 'Recreated' in wikijs_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ wikijs_port }}/healthz"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: wikijs_http
  until: wikijs_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 60
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-wikijs
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Wiki.js {{ 'responde' if (wikijs_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-wikijs logs, en ' ~ wikijs_dir ~ ')' }} en {{ wikijs_url }}.
      Entra enseguida y sigue el asistente (crea el administrador).
