---
- name: Carpeta de Immich
  ansible.builtin.set_fact:
    immich_dir: /srv/draupnode/apps/immich
    immich_url: "{{ ('https://' ~ immich_domain) if immich_domain else ('http://127.0.0.1:' ~ immich_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # La de PostgreSQL la deja la imagen en 0700: no se toca (si no, cambiaría en cada aplicación).
    mode: "{{ omit if item.endswith('/postgres') else '0750' }}"
  loop:
    - "{{ immich_dir }}"
    - "{{ immich_dir }}/library"
    - "{{ immich_dir }}/postgres"

- name: Contraseña «.immich_db» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    immich_db_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.immich_db', chars=['ascii_letters', 'digits'], length=32) }}"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Immich
  ansible.builtin.command: docker compose -p dn-immich up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ immich_dir }}"
  register: immich_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: immich_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in immich_up.stderr or 'Created' in immich_up.stderr or 'Recreated' in immich_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ immich_port }}/api/server/ping"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: immich_http
  until: immich_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 100
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-immich
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Immich {{ 'responde' if (immich_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-immich logs, en ' ~ immich_dir ~ ')' }} en {{ immich_url }}.
      Entra enseguida y crea el administrador (el primero que entra lo es).
