---
- name: ¿Está Valkey?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/valkey/docker-compose.yml
  register: valkey_cf

- name: Parar y quitar Valkey
  ansible.builtin.command: docker compose -p dn-valkey down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/valkey
  when: valkey_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/valkey {{ draupnode_secrets_dir | quote }}/valkey_password
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Valkey {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/valkey: si lo reinstalas, vuelve todo.' }}"
