id: uptime-kuma
name: "Uptime Kuma (¿están vivas mis webs?)"
version: 1.0.0
category: 6 · Monitorización
description: "Comprueba cada minuto que tus webs, puertos y servicios responden, te avisa (Telegram, ntfy, correo…) y hace una página de estado pública."
details: |
  Uptime Kuma 2 en Docker. El primer usuario que entra se queda de
  administrador: entra enseguida después de aplicar.
  Mejor en un servidor DISTINTO del que vigila: si se cae ese servidor,
  este sigue avisando.
  Sus datos están en /srv/draupnode/apps/uptime-kuma (entran en las copias del
  módulo Copias). Licencia: MIT.
depends: [docker]
requires:
  os: [ubuntu, debian]
  min_ram_mb: 300
firewall_ports_from: [uptime_kuma_public_port]
proxy_site:
  domain: uptime_kuma_domain
  port: uptime_kuma_port
uninstall_warning: "Para y quita los contenedores de Uptime Kuma."
uninstall_data: "Borrar también sus datos (las comprobaciones, su historial y los avisos configurados). No se puede deshacer."
variables:
  - name: uptime_kuma_port
    label: Puerto en el servidor (solo local)
    help: "La app escucha en 127.0.0.1 en este puerto. Se llega por el dominio (Caddy/nginx), por la VPN o con «Abrir» (túnel SSH)."
    type: int
    default: 3002
    min: 1024
    max: 65535
  - name: uptime_kuma_domain
    label: Dominio
    help: "Opcional. Con Caddy o nginx en el servidor, se publica en https://dominio."
    type: string
    default: ""
    pattern: '^(([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,})?$'
    pattern_help: Un dominio (app.ejemplo.com) o vacío
  - name: uptime_kuma_public_port
    label: Abrir un puerto a internet
    help: "0 = no (lo normal, con dominio o por la VPN). Si no, http://IP:puerto y se abre en el Cortafuegos."
    type: int
    default: 0
    min: 0
    max: 65535
  - name: uptime_kuma_update
    label: Actualizar Uptime Kuma al aplicar
    help: Descarga la última versión de la imagen cada vez que aplicas.
    type: bool
    default: true
links:
  - label: "Web oficial"
    url: https://uptime.kuma.pet
  - label: "Código fuente"
    url: https://github.com/louislam/uptime-kuma

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí."
  pasos:
    - "Añade «Uptime Kuma» y aplica."
    - "Pulsa «Abrir (túnel SSH)», crea el administrador y añade una comprobación HTTP (por ejemplo https://ejemplo.com)."
  comprobar:
    - "La comprobación sale en verde con su tiempo de respuesta y se repite cada minuto."
    - "Si pones una dirección que no existe, sale en rojo y avisa (si has configurado un aviso)."
  necesita:
    - "Nada al instalarlo. Dentro: qué vigilar y por dónde avisar (Telegram, ntfy, correo…)."
  problemas:
    - "Vigila webs de este mismo servidor y no avisa cuando se cae → instálalo en OTRO servidor."
