---
- name: Carpeta de Uptime Kuma
  ansible.builtin.set_fact:
    uptime_kuma_dir: /srv/draupnode/apps/uptime-kuma
    uptime_kuma_url: "{{ ('https://' ~ uptime_kuma_domain) if uptime_kuma_domain else ('http://127.0.0.1:' ~ uptime_kuma_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ uptime_kuma_dir }}"
    - "{{ uptime_kuma_dir }}/data"

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: false

- name: Arrancar Uptime Kuma
  ansible.builtin.command: docker compose -p dn-uptime-kuma up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ uptime_kuma_dir }}"
  register: uptime_kuma_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: uptime_kuma_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in uptime_kuma_up.stderr or 'Created' in uptime_kuma_up.stderr or 'Recreated' in uptime_kuma_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ uptime_kuma_port }}/"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: uptime_kuma_http
  until: uptime_kuma_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 60
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-uptime-kuma
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Uptime Kuma {{ 'responde' if (uptime_kuma_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-uptime-kuma logs, en ' ~ uptime_kuma_dir ~ ')' }} en {{ uptime_kuma_url }}.
      Entra enseguida y crea el administrador (el primero que entra lo es).
