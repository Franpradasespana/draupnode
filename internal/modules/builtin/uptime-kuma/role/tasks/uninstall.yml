---
- name: ¿Está Uptime Kuma?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/uptime-kuma/docker-compose.yml
  register: uptime_kuma_cf

- name: Parar y quitar Uptime Kuma
  ansible.builtin.command: docker compose -p dn-uptime-kuma down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/uptime-kuma
  when: uptime_kuma_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/uptime-kuma 
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Uptime Kuma {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/uptime-kuma: si lo reinstalas, vuelve todo.' }}"
