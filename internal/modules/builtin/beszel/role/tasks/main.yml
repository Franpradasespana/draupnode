---
- name: Carpeta de Beszel
  ansible.builtin.set_fact:
    beszel_dir: /srv/draupnode/apps/beszel
    beszel_url: "{{ ('https://' ~ beszel_domain) if beszel_domain else ('http://127.0.0.1:' ~ beszel_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ beszel_dir }}"
    - "{{ beszel_dir }}/data"
    - "{{ beszel_dir }}/socket"

- name: Contraseña «.beszel_admin_pass» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    beszel_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.beszel_admin_pass', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: Clave del hub (la crea Draupnode para dársela al agente)
  ansible.builtin.command: ssh-keygen -q -t ed25519 -N '' -C beszel -f {{ beszel_dir }}/data/id_ed25519
  args:
    creates: "{{ beszel_dir }}/data/id_ed25519"
  when: not ansible_check_mode

- name: Leer la clave pública
  ansible.builtin.slurp:
    src: "{{ beszel_dir }}/data/id_ed25519.pub"
  register: beszel_pub
  when: not ansible_check_mode

- name: Usuario y contraseña, para verlos en la app
  ansible.builtin.copy:
    dest: "{{ draupnode_secrets_dir }}/beszel_admin"
    mode: "0600"
    content: "Usuario: admin@beszel.local\nContraseña: {{ beszel_admin_pass }}\n"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ beszel_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Beszel
  ansible.builtin.command: docker compose -p dn-beszel up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ beszel_dir }}"
  register: beszel_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: beszel_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in beszel_up.stderr or 'Created' in beszel_up.stderr or 'Recreated' in beszel_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_port }}/api/health"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: beszel_http
  until: beszel_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 30
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-beszel
  when: not ansible_check_mode

- name: Entrar en el hub
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_port }}/api/collections/users/auth-with-password"
    method: POST
    body_format: json
    body: {"identity": "admin@beszel.local", "password": "{{ beszel_admin_pass }}"}
  register: beszel_auth
  retries: 10
  delay: 3
  until: beszel_auth.status == 200
  failed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Sistemas dados de alta
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_port }}/api/collections/systems/records"
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
  register: beszel_systems
  when: not ansible_check_mode and beszel_auth.status | default(0) == 200

- name: Dar de alta este servidor (por el socket compartido)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_port }}/api/collections/systems/records"
    method: POST
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    body_format: json
    body:
      name: "{{ ansible_hostname }}"
      host: /beszel_socket/beszel.sock
      port: "45876"
      users: ["{{ beszel_auth.json.record.id }}"]
  changed_when: true
  when: not ansible_check_mode and beszel_auth.status | default(0) == 200 and (beszel_systems.json['items'] | selectattr('host', 'equalto', '/beszel_socket/beszel.sock') | list | length) == 0

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Beszel {{ 'responde' if (beszel_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-beszel logs, en ' ~ beszel_dir ~ ')' }} en {{ beszel_url }}.
      Entra con admin@beszel.local (contraseña en «Contraseñas»): este servidor ya está dado de alta.
