---
- name: ¿Está Forgejo?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/forgejo/docker-compose.yml
  register: forgejo_cf

- name: Parar y quitar Forgejo
  ansible.builtin.command: docker compose -p dn-forgejo down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/forgejo
  when: forgejo_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/forgejo {{ draupnode_secrets_dir | quote }}/forgejo_admin {{ draupnode_secrets_dir | quote }}/.forgejo_admin_pass
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Forgejo {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/forgejo: si lo reinstalas, vuelve todo.' }}"
