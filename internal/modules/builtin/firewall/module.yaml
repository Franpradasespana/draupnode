id: firewall
name: Cortafuegos (iptables)
version: 1.0.0
category: 1 · Sistema
description: Abre en el cortafuegos del servidor los puertos TCP indicados y guarda las reglas para que sobrevivan a un reinicio.
details: |
  Usa iptables + netfilter-persistent, que es lo que traen las imágenes de Ubuntu
  de Oracle Cloud (su INPUT acaba en REJECT, así que hay que abrir cada puerto).
  En Oracle Cloud abre también los mismos puertos en la «Security List» de la VCN:
  eso es un cortafuegos aparte, fuera del servidor.
depends: [base]
requires:
  os: [ubuntu, debian]
uninstall_warning: Quita las reglas que abrió Draupnode en iptables (salvo el SSH, para no perder la conexión). Las demás reglas del servidor no se tocan.
variables:
  - name: firewall_tcp_ports
    label: Puertos TCP abiertos
    help: El 22 (SSH) se abre siempre aunque no esté en la lista.
    type: list
    default: ["22", "80", "443"]
    pattern: '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
    pattern_help: Número de puerto entre 1 y 65535
links:
  - label: "iptables (netfilter)"
    url: https://www.netfilter.org/projects/iptables/
  - label: "Código fuente"
    url: https://git.netfilter.org/iptables/

# Cómo probarlo (Ayuda → Catálogo → «Probar cada módulo»).
prueba:
  lab: "Sí (el contenedor de pruebas tiene iptables)."
  pasos:
    - "Añade «Cortafuegos» con los puertos 22, 80 y 443 y aplica."
    - "Añade después otro puerto (por ejemplo 8080), aplica, y luego quítalo y aplica otra vez."
  comprobar:
    - "Ficha → Red y seguridad: «El cortafuegos deja pasar» enseña 22/tcp, 80/tcp y 443/tcp."
    - "En «Terminal»: «sudo iptables -S INPUT» tiene las reglas con la etiqueta draupnode y «/etc/iptables/rules.v4» las guarda."
    - "El SSH sigue funcionando (la ficha se sigue leyendo) y el 8080 aparece y desaparece al añadirlo y quitarlo."
  necesita:
    - "Los puertos TCP que quieres abiertos, uno por línea. Los que necesitan otros módulos (80/443 de Caddy o nginx, 8000 de Coolify…) se añaden solos al marcarlos."
    - "Deja siempre el del SSH (22 o el que pongas en «SSH seguro»): Draupnode no te deja quitarlo."
  problemas:
    - "Un puerto abierto aquí no se ve desde fuera → el proveedor de nube (Oracle, AWS…) tiene su propio cortafuegos: ábrelo también en su panel (la ficha avisa si lo detecta)."
    - "Un puerto de Docker se ve desde fuera aunque no esté en la lista → lo que publica Docker se salta iptables; publica las apps solo en 127.0.0.1 (los módulos ya lo hacen) y entra por Caddy/nginx o el túnel."
