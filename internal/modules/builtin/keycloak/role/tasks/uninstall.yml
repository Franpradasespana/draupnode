---
- name: ¿Está Keycloak?
  ansible.builtin.stat:
    path: /srv/draupnode/apps/keycloak/docker-compose.yml
  register: keycloak_cf

- name: Parar y quitar Keycloak
  ansible.builtin.command: docker compose -p dn-keycloak down {{ '-v' if draupnode_uninstall_purge | bool else '' }}
  args:
    chdir: /srv/draupnode/apps/keycloak
  when: keycloak_cf.stat.exists and not ansible_check_mode

- name: Borrar sus datos
  ansible.builtin.shell: rm -rf /srv/draupnode/apps/keycloak {{ draupnode_secrets_dir | quote }}/keycloak_admin {{ draupnode_secrets_dir | quote }}/.keycloak_admin_pass {{ draupnode_secrets_dir | quote }}/.keycloak_db
  when: draupnode_uninstall_purge | bool and not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: "Keycloak {{ 'se quitará' if ansible_check_mode else 'quitado' }}.{{ ' También sus datos.' if draupnode_uninstall_purge | bool else ' Sus datos siguen en /srv/draupnode/apps/keycloak: si lo reinstalas, vuelve todo.' }}"
