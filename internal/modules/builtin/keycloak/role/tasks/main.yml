---
- name: Carpeta de Keycloak
  ansible.builtin.set_fact:
    keycloak_dir: /srv/draupnode/apps/keycloak
    keycloak_url: "{{ ('https://' ~ keycloak_domain) if keycloak_domain else ('http://127.0.0.1:' ~ keycloak_port ~ ' (en el servidor: usa «Abrir» en la página del módulo)') }}"

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # La de PostgreSQL la deja la imagen en 0700: no se toca (si no, cambiaría en cada aplicación).
    mode: "{{ omit if item.endswith('/pgdata') else '0750' }}"
  loop:
    - "{{ keycloak_dir }}"
    - "{{ keycloak_dir }}/pgdata"

- name: Contraseña «.keycloak_admin_pass» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    keycloak_admin_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.keycloak_admin_pass', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: not ansible_check_mode

- name: Contraseña «.keycloak_db» (se genera en el servidor la primera vez)
  ansible.builtin.set_fact:
    keycloak_db_pass: "{{ lookup('ansible.builtin.password', draupnode_secrets_dir ~ '/.keycloak_db', chars=['ascii_letters', 'digits'], length=32) }}"
  no_log: true
  when: not ansible_check_mode

- name: docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ keycloak_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Arrancar Keycloak
  ansible.builtin.command: docker compose -p dn-keycloak up -d --quiet-pull --remove-orphans
  args:
    chdir: "{{ keycloak_dir }}"
  register: keycloak_up
  # Los registros de imágenes a veces responden «demasiadas peticiones»: se reintenta.
  until: keycloak_up.rc == 0
  retries: 3
  delay: 30
  changed_when: "'Started' in keycloak_up.stderr or 'Created' in keycloak_up.stderr or 'Recreated' in keycloak_up.stderr"
  when: not ansible_check_mode

- name: Esperar a que responda
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ keycloak_port }}/realms/master"
    status_code: [200, 204, 301, 302, 303, 307, 308, 401, 403]
    follow_redirects: none
  register: keycloak_http
  until: keycloak_http.status in [200, 204, 301, 302, 303, 307, 308, 401, 403]
  retries: 100
  delay: 3
  failed_when: false
  when: not ansible_check_mode

- name: Comprobar que no se reinicia sin parar
  ansible.builtin.include_role:
    name: draupnode_preflight
    tasks_from: no_reinicia
  vars:
    dn_compose_project: dn-keycloak
  when: not ansible_check_mode

- name: Usuario y contraseña, para verlos en la app
  ansible.builtin.copy:
    dest: "{{ draupnode_secrets_dir }}/keycloak_admin"
    mode: "0600"
    content: "Usuario: admin\nContraseña: {{ keycloak_admin_pass }}\n"
  no_log: true
  when: not ansible_check_mode

- name: Nota
  ansible.builtin.debug:
    msg: >-
      Keycloak {{ 'responde' if (keycloak_http.status | default(0)) in [200, 204, 301, 302, 303, 307, 308, 401, 403] else 'NO responde todavía (mira: docker compose -p dn-keycloak logs, en ' ~ keycloak_dir ~ ')' }} en {{ keycloak_url }}.
      Entra con «admin» (contraseña en «Contraseñas»), crea tu propio administrador y borra «admin».
